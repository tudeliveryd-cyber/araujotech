function openNow(days){if(!Array.isArray(days)||days.length!==7)return null;const d=new Date(),n=d.getHours()*60+d.getMinutes(),wd=d.getDay();
 const ivs=x=>!x||!x.on?[]:[x.a,x.b].filter(r=>Array.isArray(r)&&toM(r[0])!=null&&toM(r[1])!=null).map(r=>{const a=toM(r[0]);let b=toM(r[1]);if(b<=a)b+=1440;return [a,b,r[1]]});
