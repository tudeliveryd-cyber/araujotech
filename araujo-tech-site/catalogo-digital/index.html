<style>
:root{--purple:#8A12D6;--deep:#4A0A80;--night:#24093F;--lilac:#F3ECFB;--ink:#1A1222;--muted:#5F566B;--line:#E4DAF0;--ok:#11845A;--display:"Red Hat Display",system-ui,sans-serif;--text:"Red Hat Text",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--text);font-size:17px;line-height:1.6;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--display);line-height:1.1;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 24px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;border:2px solid transparent;cursor:pointer;white-space:nowrap}
.btn-solid{background:var(--purple);color:#fff}.btn-solid:hover{background:var(--deep)}
.btn-white{background:#fff;color:var(--deep)}
.btn-line{border-color:rgba(255,255,255,.55);color:#fff}.btn-line:hover{background:rgba(255,255,255,.1)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:#fff}.btn-ghost:hover{border-color:var(--purple)}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
/* topo */
.hdr{position:absolute;inset:0 0 auto;z-index:10;color:#fff}
.nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand img{height:38px;width:auto}
.right{display:flex;align-items:center;gap:10px}
.back{font-size:15px;font-weight:500;text-decoration:none;opacity:.85}.back:hover{opacity:1}
.lang{display:flex;padding:2px;border-radius:999px;border:1px solid rgba(255,255,255,.4);font-size:12px;font-weight:700}
.lang button{border:0;background:none;padding:5px 10px;border-radius:999px;cursor:pointer;color:inherit;opacity:.75;line-height:1}
.lang button.on{opacity:1;background:#fff;color:var(--deep)}
/* hero */
.hero{background:radial-gradient(900px 600px at 85% 0%,#5B1E9E 0%,rgba(91,30,158,0) 60%),linear-gradient(160deg,#2F0C55,var(--night) 65%);color:#fff;padding:130px 0 80px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center}
.kick{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#D8B4FE;margin-bottom:14px}
.hero h1{font-size:clamp(36px,5vw,58px);font-weight:900}
.hero p{font-size:19px;color:#E9D5FF;margin-top:18px;max-width:34em}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.chips span{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.devs{position:relative;padding-right:14%}.devs .cel img{width:100%;height:100%;object-fit:cover;object-position:top}.devs .pc img{width:100%;height:auto}
.devs .pc{border-radius:12px;overflow:hidden;border:8px solid #0d0618;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.devs .cel{position:absolute;right:0;bottom:-24px;width:25%;aspect-ratio:390/844;border-radius:22px;overflow:hidden;border:6px solid #0d0618;box-shadow:0 20px 40px rgba(0,0,0,.5)}
/* seções */
section{padding:96px 0}
section.alt{background:var(--lilac)}
.head{max-width:720px;margin-bottom:48px}
.head h2{font-size:clamp(30px,3.6vw,44px);font-weight:900}
.head p{color:var(--muted);font-size:18px;margin-top:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.step{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.step b{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:19px;margin-bottom:8px}
.step b:before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:15px;flex:none}
.step p{color:var(--muted);font-size:15.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat{border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff}
.feat .ic{width:46px;height:46px;border-radius:12px;background:var(--lilac);color:var(--purple);display:grid;place-items:center;margin-bottom:14px}
.feat .ic svg{width:23px;height:23px}
.feat b{display:block;font-family:var(--display);font-size:18px;margin-bottom:4px}
.feat p{color:var(--muted);font-size:15px;line-height:1.5}
.row{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;padding:40px 0}
.row.rev{grid-template-columns:.85fr 1.15fr}.row.rev .pic{order:2}
.pic{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 18px 40px rgba(60,20,110,.12);background:#fff}
.pic.tall{max-width:330px;justify-self:center}
.row h3{font-size:clamp(24px,2.6vw,32px);font-weight:900;margin-bottom:10px}
.row p{color:var(--muted)}
.row ul{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:10px}
.row li{display:flex;gap:10px;align-items:flex-start}
.row li svg{color:var(--ok);margin-top:3px}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.plan{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.plan.top{border:2px solid var(--purple);position:relative}
.plan.top:before{content:attr(data-badge);position:absolute;top:-13px;left:22px;background:var(--purple);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.04em}
.plan h3{font-size:24px;font-weight:900}
.plan .sub{color:var(--muted);font-size:15px;margin-top:-8px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px;flex:1}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li svg{width:18px;height:18px;margin-top:3px;color:var(--ok)}
.plan li.no{color:#A69CB3}.plan li.no svg{color:#C9C0D4}
.note{color:var(--muted);font-size:15px;margin-top:20px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{font-weight:700;font-size:18px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq p{color:var(--muted);margin-top:10px}
.final{background:linear-gradient(160deg,#2F0C55,var(--night) 70%);color:#fff;text-align:center}
.final h2{font-size:clamp(30px,4vw,46px);font-weight:900}
.final p{color:#E9D5FF;margin:14px auto 0;max-width:36em;font-size:18px}
.final .ctas{justify-content:center}

@media (max-width:980px){.ramos{grid-template-columns:1fr 1fr}}@media (max-width:600px){.ramos{grid-template-columns:1fr 1fr;gap:10px}.ramo{flex-direction:column;align-items:flex-start;padding:12px}.ramo b{font-size:14px}}
footer{padding:28px 0;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--deep);font-weight:700;text-decoration:none}
@media (max-width:980px){.hero .wrap,.row,.row.rev{grid-template-columns:1fr}.row.rev .pic{order:0}.steps{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.plans{grid-template-columns:1fr 1fr}.devs{margin-top:10px}}
@media (max-width:600px){.wrap{padding:0 18px}.back{display:none}.brand img{height:30px}.hero{padding:110px 0 70px}.hero .btn{flex:1 1 100%}section{padding:70px 0}.steps,.grid,.plans{grid-template-columns:1fr}.final .btn{width:100%}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* rodapé centralizado (computador e celular) */
footer{text-align:center}footer .wrap{flex-direction:column;align-items:center;justify-content:center;gap:6px}
.rgrp{display:none;margin-top:28px}.rgrp.open{display:grid}.rmore{display:flex;justify-content:center;margin-top:20px}.rmore .btn svg{transition:transform .2s}.rmore .btn.on svg{transform:rotate(180deg)}@media (max-width:600px){.ramos{gap:8px}.ramo{flex-direction:row!important;align-items:center!important;padding:10px!important;gap:10px}.ramo .ic{width:34px;height:34px;border-radius:9px}.ramo .ic svg{width:18px;height:18px}.ramo b{font-size:13.5px!important}.ramo small{font-size:12px}.rmore .btn{width:100%;justify-content:center}}

 <section class="alt"><div class="wrap"><div class="head"><h2>${t.ft_h}</h2><p>${t.ft_p}</p></div><div class="grid">${t.feats.map(([k,a,b])=>`<div class="feat"><span class="ic">${ic(k)}</span><b>${a}</b><p>${b}</p></div>`).join('')}</div></div></section>
 <section><div class="wrap">${t.rows.map(([img,h,p,li,tall],i)=>`<div class="row ${i%2?'rev':''}"><div class="pic ${tall?'tall':''}"><img src="../img/catalogo/${img}.jpg" alt="${h}" loading="lazy"></div><div><h3>${h}</h3><p>${p}</p><ul>${li.map(ok).join('')}</ul></div></div>`).join('')}</div></section>
 <section class="alt" id="planes"><div class="wrap"><div class="head"><h2>${t.pl_h}</h2><p>${t.pl_p}</p></div><div class="plans">${t.plans.map(([n,s,yes,no],i)=>`<div class="plan ${i===2?'top':''}" data-badge="${t.popular}"><h3>${n}</h3><div class="sub">${s}</div><ul>${yes.map(ok).join('')}${no.map(x=>`<li class="no">${ic('x',18)}<span>${x}</span></li>`).join('')}</ul><a class="btn ${i===2?'btn-solid':'btn-ghost'} btn-sm" href="${wa((lang==='pt'?'Olá! Quero saber o preço do plano ':'¡Hola! Quiero saber el precio del plan ')+n+'.')}" target="_blank" rel="noopener">${t.ask}</a></div>`).join('')}</div><p class="note">${t.pl_note}</p></div></section>
 <section class="faq"><div class="wrap" style="max-width:860px"><div class="head"><h2>${t.fq_h}</h2></div>${t.faq.map(([q,a])=>`<details><summary>${q}<span>+</span></summary><p>${a}</p></details>`).join('')}</div></section>
 <section class="final"><div class="wrap"><h2>${t.fn_h}</h2><p>${t.fn_p}</p><div class="ctas"><a class="btn btn-white" href="${wa(msg)}" target="_blank" rel="noopener">${ic('chat')}${t.wa}</a><a class="btn btn-line" href="../demo/" target="_blank" rel="noopener">${ic('eye')}${t.demo}</a></div></div></section>`}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('at_lang',lang)}catch(e){}render()}));
render();
</script>
<script>
/* contador de visitas (uma por sessão; pessoas únicas por dia). Não conta o dono (admin). */
(function(){try{if(navigator.webdriver)return;let me=false;try{me=localStorage.getItem('at_me')==='1'}catch(e){}if(me)return;
 const d=new Date(),id=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 try{if(sessionStorage.getItem('at_vs')==='1')return;sessionStorage.setItem('at_vs','1')}catch(e){}
 let first=true;try{first=localStorage.getItem('at_vday')!==id;localStorage.setItem('at_vday',id)}catch(e){}
 const P='projects/araujotech-catalogos/databases/(default)/documents';
 fetch('https://firestore.googleapis.com/v1/'+P+':commit?key=AIzaSyBCz2X9BOgO4UZKaXppxlGbiN59qBvUR_U',{method:'POST',keepalive:true,headers:{'Content-Type':'application/json'},
  body:JSON.stringify({writes:[{update:{name:P+'/visitas/'+id,fields:{}},updateMask:{fieldPaths:[]},updateTransforms:[{fieldPath:'n',increment:{integerValue:'1'}},{fieldPath:'u',increment:{integerValue:first?'1':'0'}}]}]})}).catch(()=>{})
}catch(e){}})();
</script>
