<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservas · Demostración</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.png">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: perfil del negocio estilo app (portada, tarjeta superpuesta, pestañas) y reserva en una hoja a pantalla completa */
:root{
  --brand:#8a2d49; --brand-fg:#ffffff;
  --bg:#ffffff; --surface:#ffffff; --surface2:color-mix(in srgb,var(--brand) 5%,#f3f3f4);
  --fg:#141316; --muted:#6c6970; --line:color-mix(in srgb,var(--brand) 7%,#e6e6e8);
  --accent:var(--brand); --accent-fg:var(--brand-fg); --accent-soft:color-mix(in srgb,var(--brand) 10%,#ffffff);
  --good:#1f8a5b; --bad:#c0392b; --shade:rgb(20 10 20 / .5);
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --r:14px;
  --sh:0 1px 2px rgb(0 0 0 / .05), 0 8px 28px rgb(0 0 0 / .08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f11; --surface:color-mix(in srgb,var(--brand) 5%,#18181b); --surface2:color-mix(in srgb,var(--brand) 8%,#232326);
  --fg:#f3f2f4; --muted:#a29fa6; --line:color-mix(in srgb,var(--brand) 9%,#2e2e32);
  --accent:color-mix(in srgb,var(--brand) 60%,#ffffff); --accent-fg:#141316; --accent-soft:color-mix(in srgb,var(--brand) 22%,#18181b);
  --good:#5cc192; --bad:#ef7d72; --sh:0 1px 2px rgb(0 0 0 / .5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f0f11; --surface:color-mix(in srgb,var(--brand) 5%,#18181b); --surface2:color-mix(in srgb,var(--brand) 8%,#232326);
  --fg:#f3f2f4; --muted:#a29fa6; --line:color-mix(in srgb,var(--brand) 9%,#2e2e32);
  --accent:color-mix(in srgb,var(--brand) 60%,#ffffff); --accent-fg:#141316; --accent-soft:color-mix(in srgb,var(--brand) 22%,#18181b);
  --good:#5cc192; --bad:#ef7d72; --sh:0 1px 2px rgb(0 0 0 / .5); color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{max-width:760px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Portada */
.cover{position:relative;height:220px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 92%,#000) 0%,color-mix(in srgb,var(--brand) 70%,#000) 55%,color-mix(in srgb,var(--brand) 45%,#000) 100%);overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgb(255 255 255 / .18),transparent 45%),radial-gradient(circle at 10% 110%,rgb(255 255 255 / .12),transparent 40%)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(0 0 0 / .25),transparent 40%,rgb(0 0 0 / .35))}
.cover .tools{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.roundw{width:34px;height:34px;border-radius:50%;border:0;background:rgb(255 255 255 / .92);color:#141316;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgb(0 0 0 / .15)}
.chipbtn{height:34px;padding:0 4px;border-radius:99px;background:rgb(255 255 255 / .92);color:#141316;display:inline-flex;align-items:center;gap:2px;box-shadow:0 2px 8px rgb(0 0 0 / .15)}
.chipbtn button{border:0;background:none;height:26px;padding:0 10px;border-radius:99px;font-weight:700;font-size:12px;cursor:pointer;color:#6c6970}
.chipbtn button.on{background:#141316;color:#fff}
.count{position:absolute;z-index:2;bottom:12px;right:max(12px,env(safe-area-inset-right,0px));background:rgb(0 0 0 / .55);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}

/* Tarjeta del negocio */
.biz{position:relative;margin-top:-44px;z-index:3}
.biz .card{background:var(--surface);border-radius:20px;box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.biz .top{display:flex;gap:14px;align-items:center;min-width:0}
.biz .logo{width:64px;height:64px;border-radius:16px;object-fit:cover;flex:none;background:#fff;border:1px solid var(--line)}
.biz .logo.ph{display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--brand);color:var(--brand-fg);border:0}
.biz h1{margin:0;font-size:22px;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.biz .addr{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px;margin-top:2px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.status small{color:var(--muted);font-weight:500}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--surface2);color:var(--fg);text-decoration:none;font-size:12px;font-weight:600;border:0;cursor:pointer}
.act svg{width:20px;height:20px;color:var(--accent)}

/* Pestañas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
.tabs .in{display:flex;gap:4px}
.tabs button{flex:1;border:0;background:none;padding:14px 0 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;font-size:14px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.section{padding-top:16px;display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:13px;color:var(--muted)}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 14px 0 42px;font-size:15px}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.cats button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cat-t{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:10px 0 0}
.srv{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.srv:last-child{border-bottom:0}
.srv .tx{flex:1;min-width:0}
.srv b{display:block;font-size:15px;font-weight:700}
.srv .meta{color:var(--muted);font-size:13px}
.srv .desc{color:var(--muted);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srv .pr{font-weight:700;font-size:15px;margin-top:6px}
.pillbtn{flex:none;height:36px;padding:0 16px;border-radius:99px;border:1.5px solid var(--fg);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--fg)}
.pillbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.mem{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:center}
.mem .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;background:var(--pc)}
.mem b{font-size:14px;line-height:1.2}
.mem small{color:var(--muted);font-size:12px}
.info h3{margin:6px 0 0;font-size:17px;letter-spacing:-.02em}
.hours{display:flex;flex-direction:column}
.hours div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hours div.today{font-weight:700}
.hours span:last-child{font-variant-numeric:tabular-nums}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;max-width:100%}
.policy{display:flex;gap:10px;padding:14px;border-radius:12px;background:var(--surface2);font-size:13px}
.policy svg{color:var(--muted);margin-top:1px}
.credit{text-align:center;font-size:12px;color:var(--muted);padding:20px 0 6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.credit button{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}

/* Vitrina */
.prods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.prods{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.prod .ph{aspect-ratio:1;background:color-mix(in srgb,var(--accent) 7%,var(--surface2));display:grid;place-items:center;color:color-mix(in srgb,var(--accent) 55%,var(--muted))}
.prod .ph img{width:100%;height:100%;object-fit:cover;display:block}
.prod .ph svg{width:34px;height:34px}
.prod .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod b{font-size:14px;line-height:1.3}
.prod .ds{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .pr{font-weight:800;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:4px}
.prod .lw{font-size:12px;font-weight:700;color:var(--bad)}
.addb{height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg);margin-top:6px}
.addb:disabled{opacity:.45;cursor:default}
.stp{display:flex;align-items:center;justify-content:space-between;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-fg);margin-top:6px;overflow:hidden}
.stp button{width:40px;height:100%;border:0;background:none;color:inherit;display:grid;place-items:center;cursor:pointer}
.stp button:disabled{opacity:.4}
.stp b{font-variant-numeric:tabular-nums}
.shopnote{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:13.5px;color:var(--muted)}
.shopnote svg{flex:none;margin-top:1px}
.upsell{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;flex:none}
.sh-b>*{flex-shrink:0}
.upsell .prod{flex:0 0 140px}
.cline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cline .tx{flex:1;min-width:0}.cline .tx b{display:block;font-size:14.5px}.cline .tx small{color:var(--muted)}
.cline .stp{margin:0;width:120px;flex:none}

/* Barra inferior */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cta .in{max-width:728px;margin:0 auto;display:flex;align-items:center;gap:12px}
.cta .sum{flex:1;min-width:0}
.cta .sum b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.cta .sum small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.full{width:100%}
.btn.sec{background:var(--surface2);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}

/* Hoja de reserva */
.sheet{position:fixed;inset:0;z-index:40;background:var(--shade);display:flex;justify-content:center;align-items:flex-end}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;height:100%;display:flex;flex-direction:column}
@media (min-width:700px){.sheet{align-items:center;padding:24px}.sheet .panel{height:auto;max-height:100%;border-radius:20px;overflow:hidden}}
.sh-h{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.sh-h h2{flex:1;margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;text-align:center}
.round{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.prog{height:3px;background:var(--line);margin:0 max(16px,env(safe-area-inset-left,0px))}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .25s}
.sh-b{flex:1;overflow-y:auto;padding-top:18px;padding-bottom:18px;display:flex;flex-direction:column;gap:16px}
.sh-f{border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;background:var(--surface)}
.sh-f .sum{flex:1;min-width:0}
.sh-f .sum b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.sh-f .sum small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .tx{flex:1;min-width:0}
.pick b{display:block;font-weight:700;font-size:14px}
.pick small{color:var(--muted);font-size:13px}
.pick .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.pick.on .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pick .ck svg{width:13px;height:13px;stroke-width:2.8}
.avs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.avs::-webkit-scrollbar{display:none}
.avb{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;font-size:12px;font-weight:600;text-align:center;line-height:1.2}
.avb .av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:var(--pc);box-shadow:0 0 0 2px var(--bg),0 0 0 2px transparent}
.avb.any .av{background:var(--surface2);color:var(--fg)}
.avb.on .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.avb small{color:var(--muted);font-weight:500}
.month{display:flex;align-items:center;justify-content:space-between}
.month b{font-size:16px}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;padding:10px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;line-height:1.2}
.day small{display:block;font-size:12px;color:var(--muted);text-transform:capitalize}
.day b{display:block;font-size:19px;font-weight:800;margin-top:4px}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day.on small{color:inherit;opacity:.85}
.day:disabled{opacity:.35;cursor:default}
.quick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--accent-soft);cursor:pointer;text-align:left;color:var(--fg)}
.quick svg{color:var(--accent)}
.quick b{display:block;font-size:14px}
.quick small{color:var(--muted);font-size:12px}
.tgroup{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.tm{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.tm.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tm:disabled{display:none}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{height:50px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);width:100%;font-size:16px}
.inp:focus{border-color:var(--accent);outline:none}
.summary{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.summary .hd{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.summary .hd .logo{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.summary .hd .logo.ph{display:grid;place-items:center;font-weight:800;background:var(--brand);color:var(--brand-fg)}
.summary .row{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14px}
.summary .row span:first-child{color:var(--muted)}
.summary .row span:last-child{text-align:right;font-weight:600}
.summary .tot{border-top:1px solid var(--line);font-size:16px}
.summary .tot span{color:var(--fg)!important;font-weight:800!important}
.warn{padding:10px 12px;border-radius:10px;font-size:13px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.note{font-size:13px;color:var(--muted)}
.done{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-top:20px}
.done .ok{width:76px;height:76px;border-radius:50%;background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);display:grid;place-items:center}
.done .ok svg{width:36px;height:36px;stroke-width:2.2}
.done h2{margin:0;font-size:24px;letter-spacing:-.03em}
.done .summary,.done .btn{width:100%}
.ov{position:fixed;inset:0;z-index:60;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:18px}
.modal p{margin:0;font-size:14px;color:var(--muted)}
@media (min-width:700px){.ov{align-items:center}.modal{border-radius:20px}}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .25s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(24px);opacity:.4}}}
</style>
</head>
<body>
<div style="background:#5b2bb5;color:#fff;font:600 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));position:relative;z-index:30">Demostración de <b>Araújo Tech</b> · datos de ejemplo · <a href="../#contacto" style="color:#fff;text-decoration:underline">Quiero este sistema</a></div>
<div class="page" id="page"></div>
<div class="cta" id="cta"></div>
<div id="sheet"></div>

  const insta=(SALON.instagram||"").replace(/^@/,"");
  let h=`<div class="cover">${(SALON.cover||photos[0])?`<img src="${esc(SALON.cover||photos[0])}" alt="">`:""}
    <div class="tools"><div class="chipbtn" role="group" aria-label="Idioma"><button data-l="es" class="${LG()==="es"?"on":""}">ES</button><button data-l="pt" class="${LG()==="pt"?"on":""}">PT</button></div><button class="roundw" data-theme-btn="1" aria-label="Tema">${ic(isDark()?"sun":"moon")}</button></div>
    ${photos.length>1?`<button class="count" data-tab="info">${ic("image")}${photos.length} ${t("photos")}</button>`:""}</div>
  <div class="biz gut"><div class="card">
    <div class="top">${logoEl("logo")}<div style="min-width:0"><h1>${esc(SALON.name)}</h1>${SALON.address?`<div class="addr">${ic("pin")}<span>${esc(SALON.address)}</span></div>`:""}</div></div>
    <span class="status" style="--c:${os.on?"var(--good)":"var(--bad)"}">${os.txt} <small>${os.sub}</small></span>
    <div class="actions">
      ${wn?`<a class="act" href="https://wa.me/${wn}" target="_blank" rel="noopener">${ic("chat")}${t("whats")}</a>`:`<span class="act" style="opacity:.4">${ic("chat")}${t("whats")}</span>`}
      ${insta?`<a class="act" href="https://instagram.com/${encodeURIComponent(insta)}" target="_blank" rel="noopener">${ic("insta")}Instagram</a>`:`<span class="act" style="opacity:.4">${ic("insta")}Instagram</span>`}
      ${SALON.maps?`<a class="act" href="${esc(SALON.maps)}" target="_blank" rel="noopener">${ic("map")}${t("directions")}</a>`:`<button class="act" data-tab="info">${ic("map")}${t("directions")}</button>`}
    </div></div></div>
  <nav class="tabs"><div class="in gut">${[["svc","tabSvc"],...(shopOn()?[["shop","tabShop"]]:[]),["team","tabTeam"],["info","tabInfo"]].map(([k,l])=>`<button data-tab="${k}" class="${st.tab===k?"on":""}">${t(l)}</button>`).join("")}</div></nav>
  <div class="gut">`;
  if(st.tab==="svc"){
    const cats=[...new Set(SERVICES.map(s=>s.cat))];const q=st.q.trim().toLowerCase();
    const list=SERVICES.filter(s=>(st.cat==="all"||s.cat===st.cat)&&(!q||s.name.toLowerCase().includes(q)||(s.desc||"").toLowerCase().includes(q)));
    h+=`<div class="section"><div class="search">${ic("search")}<input id="q" placeholder="${t("search")}" value="${esc(st.q)}" aria-label="${t("search")}"></div>
      <div class="cats"><button data-cat="all" class="${st.cat==="all"?"on":""}">${t("all")}</button>${cats.map(c=>`<button data-cat="${esc(c)}" class="${st.cat===c?"on":""}">${esc(c)}</button>`).join("")}</div>
      ${cats.filter(c=>list.some(s=>s.cat===c)).map(c=>`<div><div class="cat-t">${esc(c)}</div>${list.filter(s=>s.cat===c).map(s=>{const on=st.svc.includes(s.id);return `<div class="srv"><div class="tx"><b>${esc(s.name)}</b><div class="meta">${s.dur} ${t("min")}</div>${s.desc?`<div class="desc">${esc(s.desc)}</div>`:""}<div class="pr num">${gs(s.price)}</div></div><button class="pillbtn ${on?"on":""}" data-book="${s.id}">${on?t("added"):t("book")}</button></div>`}).join("")}</div>`).join("")||`<div class="empty">—</div>`}</div>`;
  }
  if(st.tab==="shop"&&shopOn()){
    h+=`<div class="section"><div class="shopnote">${ic("bag")}<span>${t("shopNote")}</span></div><div class="prods">${PRODUCTS.map(prodCard).join("")}</div></div>`;
  }
  if(st.tab==="team"){
    h+=`<div class="section"><div class="team">${PROS.map(p=>`<button class="mem" data-pro-start="${p.id}" style="--pc:${p.color}"><span class="av">${ini(p.name)}</span><b>${esc(p.name)}</b><small>${esc(p.role||"")}</small></button>`).join("")}</div></div>`;
  }
  if(st.tab==="info"){
    const dn=t("dayNames"),td=new Date().getDay();
    h+=`<div class="section info">
      <h3>${t("hoursT")}</h3><div class="hours">${[1,2,3,4,5,6,0].map(i=>{const r=dayRange(i);return `<div class="${i===td?"today":""}"><span>${dn[i]}</span><span>${r?r[0]+" – "+r[1]:t("closed")}</span></div>`}).join("")}</div>
      ${SALON.address?`<h3>${t("addressT")}</h3><p style="margin:0">${esc(SALON.address)}</p>${SALON.maps?`<a class="btn sec" href="${esc(SALON.maps)}" target="_blank" rel="noopener">${ic("map")}${t("directions")}</a>`:""}`:""}
      ${SALON.policy?`<h3>${t("policyT")}</h3><div class="policy">${ic("info")}<span>${esc(SALON.policy)}</span></div>`:""}
      ${photos.length?`<h3>${t("photosT")}</h3><div class="photos">${photos.map(p=>`<img src="${esc(p)}" alt="" loading="lazy">`).join("")}</div>`:""}</div>`;
  }
  h+=`<div class="credit"><span>Desarrollado por <b>Araújo Tech</b></span><button data-privacy="1">${t("privacy")}</button></div></div>`;
  $("#page").innerHTML=h;
  const cn=cartN();
  $("#cta").innerHTML=`<div class="in"><div class="sum">${st.svc.length?`<b>${gs(total()+cartTot())}</b><small>${esc(sel().map(s=>s.name).join(" + "))} · ${dur()} ${t("min")}${cn?" · "+nItems(cn):""}</small>`:cn?`<b>${gs(cartTot())}</b><small>${nItems(cn)}</small>`:`<b>${esc(SALON.name)}</b><small>${t("tag")}</small>`}</div>${cn&&!st.svc.length?`<button class="btn sec" data-open="1" style="padding:0 16px">${t("book")}</button><button class="btn" data-order="1" style="padding:0 18px">${ic("bag")}${t("orderShort")}</button>`:`<button class="btn" data-open="1">${t("reserveCta")}</button>`}</div>`;
  $("#cta").hidden=st.sheet;
  renderSheet();
}

/* ---------- Hoja de reserva ---------- */
function renderSheet(){
  const el=$("#sheet");
  if(!st.sheet){el.innerHTML="";document.body.style.overflow="";return}
  document.body.style.overflow="hidden";
  const titles=[t("stepSvc"),t("stepWhen"),t("stepYou")];
  let body="",foot="";
  const sumHtml=()=>st.svc.length?`<b>${gs(total()+cartTot())}</b><small>${esc(sel().map(s=>s.name).join(" + "))} · ${dur()} ${t("min")}${st.time?" · "+dayWord(st.date)+" "+st.time:""}${cartN()?" · "+nItems(cartN()):""}</small>`:`<small>${t("sum0")}</small>`;
  if(st.mode==="order")return renderOrder(el);
  if(st.sent){
    const proName=st.pro==="any"?t("any"):(PROS.find(p=>p.id===st.pro)||{}).name, wn=waNum(SALON.phone);
    const msg=t("wa").replace("{salon}",SALON.name).replace("{svc}",sel().map(x=>x.name).join(", ")).replace("{pro}",proName).replace("{date}",dateLabel(st.date)).replace("{hour}",st.time).replace("{name}",st.name).replace("{phone}",st.phone).replace("\nNombre","\n"+(cartN()?t("waP").replace("{p}",cartTxt()).slice(1)+"\n":"")+"Nombre").replace("\nNome","\n"+(cartN()?t("waP").replace("{p}",cartTxt()).slice(1)+"\n":"")+"Nome");
    el.innerHTML=`<div class="sheet"><div class="panel" role="dialog" aria-modal="true" aria-label="${t("doneT")}"><div class="sh-h"><span style="width:40px"></span><h2></h2><button class="round" data-close="1" aria-label="${t("close")}">${ic("x")}</button></div>
      <div class="sh-b gut"><div class="done"><div class="ok">${ic("check")}</div><h2>${t("doneT")}</h2><p class="note" style="margin:0">${t("doneS")}</p>
      ${summary(proName)}
      ${wn?`<a class="btn full" target="_blank" rel="noopener" href="https://wa.me/${wn}?text=${encodeURIComponent(msg)}">${ic("chat")}${t("sendWa")}</a>`:""}
      <a class="btn sec full" target="_blank" rel="noopener" href="${gcal()}">${ic("cal")}${t("addCal")}</a>
      ${SALON.policy?`<div class="policy" style="text-align:left;width:100%">${ic("info")}<span>${esc(SALON.policy)}</span></div>`:""}
      <button class="btn sec full" data-close="1">${t("again")}</button></div></div></div></div>`;
    return;
  }
  if(st.step===0){
    const el2=eligible();
    body=`<div class="lbl">${t("pickSvc")}</div><div style="display:flex;flex-direction:column;gap:8px">
      ${SERVICES.filter(s=>st.pro==="any"||!(PROS.find(p=>p.id===st.pro)||{}).svc||(PROS.find(p=>p.id===st.pro).svc.includes(s.id))).map(s=>{const on=st.svc.includes(s.id);return `<button class="pick ${on?"on":""}" data-svc="${s.id}" aria-pressed="${on}"><span class="tx"><b>${esc(s.name)}</b><small>${s.dur} ${t("min")} · ${gs(s.price)}</small></span><span class="ck">${on?ic("check"):""}</span></button>`}).join("")}</div>
      <div class="lbl">${t("pickPro")}</div>
      <div class="avs"><button class="avb any ${st.pro==="any"?"on":""}" data-pro="any"><span class="av">${ic("users")}</span>${t("any")}<small>${t("anyS")}</small></button>
      ${(st.svc.length?el2:PROS).map(p=>`<button class="avb ${st.pro===p.id?"on":""}" data-pro="${p.id}" style="--pc:${p.color}"><span class="av">${ini(p.name)}</span>${esc(p.name.split(" ")[0])}<small>${esc(p.role||"")}</small></button>`).join("")}</div>
      ${st.svc.length&&!el2.length?`<div class="warn">${t("noPro")}</div>`:""}
      ${shopOn()&&st.svc.length?`<div class="lbl">${t("upsellT")}</div><small class="note" style="margin-top:-8px">${t("upsellS")}</small><div class="upsell">${PRODUCTS.map(prodCard).join("")}</div>`:""}`;
    foot=`<div class="sum">${sumHtml()}</div><button class="btn" data-next="1" ${st.svc.length&&eligible().length?"":"disabled"}>${t("next")}</button>`;
  }
  if(st.step===1){
    const nf=nextFree();const days=[];const now=new Date();for(let i=0;i<21;i++){const d=new Date(now);d.setDate(now.getDate()+i);days.push(d)}
    if(!st.date&&nf)st.date=nf.date;
    let mon=parse(st.date||ymd(now)).toLocaleDateString(t("fmt"),{month:"long",year:"numeric"});mon=mon.charAt(0).toUpperCase()+mon.slice(1);
    body=`${nf?`<button class="quick" data-quick="${nf.date}|${nf.time}">${ic("bolt")}<span><b>${t("quick")}: ${dayWord(nf.date)} ${nf.time}</b><small>${esc(sel().map(s=>s.name).join(" + "))}</small></span></button>`:""}
      <div class="month"><b>${mon}</b></div>
      <div class="days">${days.map(d=>{const s=ymd(d),open=dayOpen(s);return `<button class="day ${st.date===s?"on":""}" data-date="${s}" ${open?"":"disabled"}><small>${d.toLocaleDateString(t("fmt"),{weekday:"short"}).replace(".","")}</small><b>${d.getDate()}</b></button>`}).join("")}</div>`;
    if(st.date){const sl=slots(st.date).filter(x=>x.free);
      const grp=(lbl,icon,f)=>{const g=sl.filter(f);return g.length?`<div class="tgroup">${ic(icon)}${lbl}</div><div class="times">${g.map(x=>`<button class="tm ${st.time===toHM(x.m)?"on":""}" data-time="${toHM(x.m)}">${toHM(x.m)}</button>`).join("")}</div>`:""};
      body+=sl.length?grp(t("morning"),"sun",x=>x.m<720)+grp(t("afternoon"),"moon",x=>x.m>=720):`<div class="empty">${t("noSlot")}</div>`}
    foot=`<div class="sum">${sumHtml()}</div><button class="btn" data-next="1" ${st.time?"":"disabled"}>${t("next")}</button>`;
  }
  if(st.step===2){
    const proName=st.pro==="any"?t("any"):(PROS.find(p=>p.id===st.pro)||{}).name;
    body=`${summary(proName)}
      <div class="lbl">${t("you")}</div>
      <div class="field"><label for="nm">${t("name")}</label><input class="inp" id="nm" value="${esc(st.name)}" autocomplete="name"></div>
      <div class="field"><label for="ph">${t("phone")}</label><input class="inp" id="ph" value="${esc(st.phone)}" inputmode="tel" placeholder="09xx xxx xxx" autocomplete="tel"></div>
      <small class="note">${t("remember")}</small>
      ${SALON.policy?`<div class="policy">${ic("info")}<span><b>${t("policyT")}.</b> ${esc(SALON.policy)}</span></div>`:""}<div id="err"></div>`;
    foot=`<button class="btn full" data-confirm="1">${t("confirm")} · ${gs(total()+cartTot())}</button>`;
  }
  el.innerHTML=`<div class="sheet" data-shade="1"><div class="panel" role="dialog" aria-modal="true" aria-label="${titles[st.step]}">
    <div class="sh-h"><button class="round" data-back="1" aria-label="${t("next")}">${ic("left")}</button><h2>${titles[st.step]}</h2><button class="round" data-close="1" aria-label="${t("close")}">${ic("x")}</button></div>
    <div class="prog"><i style="width:${(st.step+1)/3*100}%"></i></div>
    <div class="sh-b gut">${body}</div><div class="sh-f">${foot}</div></div></div>`;
  const on=el.querySelector(".day.on");if(on)on.scrollIntoView({block:"nearest",inline:"center"});
}
function summary(proName){return `<div class="summary"><div class="hd">${logoEl("logo")}<div><b>${esc(SALON.name)}</b><div class="note">${esc(SALON.address||"")}</div></div></div>
  <div class="row"><span>${t("service")}</span><span>${esc(sel().map(s=>s.name).join(" + "))}</span></div>
  <div class="row"><span>${t("pro")}</span><span>${esc(proName)}</span></div>
  <div class="row"><span>${t("date")}</span><span>${dateLabel(st.date)}</span></div>
  <div class="row"><span>${t("hour")}</span><span class="num">${st.time} · ${dur()} ${t("min")}</span></div>
  ${cartN()?`<div class="row"><span>${t("prodT")}</span><span>${esc(cartTxt())}</span></div>`:""}
  <div class="row tot"><span>${t("total")}</span><span class="num">${gs(total()+cartTot())}</span></div></div>`}
function renderOrder(el){
  const wn=waNum(SALON.phone),its=cartItems();
  if(st.sent){el.innerHTML=`<div class="sheet"><div class="panel" role="dialog" aria-modal="true" aria-label="${t("orderDone")}"><div class="sh-h"><span style="width:40px"></span><h2></h2><button class="round" data-close="1" aria-label="${t("close")}">${ic("x")}</button></div>
    <div class="sh-b gut"><div class="done"><div class="ok">${ic("check")}</div><h2>${t("orderDone")}</h2><p class="note" style="margin:0">${t("orderDoneS")}</p><button class="btn sec full" data-close="1">${t("again")}</button></div></div></div></div>`;return}
  el.innerHTML=`<div class="sheet" data-shade="1"><div class="panel" role="dialog" aria-modal="true" aria-label="${t("orderT")}">
    <div class="sh-h"><button class="round" data-close="1" aria-label="${t("close")}">${ic("left")}</button><h2>${t("orderT")}</h2><button class="round" data-close="1" aria-label="${t("close")}">${ic("x")}</button></div>
    <div class="sh-b gut"><div>${its.map(i=>{const p=PRODUCTS.find(x=>x.id===i.id);return `<div class="cline"><div class="tx"><b>${esc(i.name)}</b><small class="num">${gs(i.price)}</small></div>${stepper(p)}</div>`}).join("")||`<div class="empty">—</div>`}</div>
      <div class="shopnote">${ic("pin")}<span>${t("pickup")}${SALON.address?" "+esc(SALON.address)+".":""}</span></div>
      <div class="lbl">${t("you")}</div>
      <div class="field"><label for="nm">${t("name")}</label><input class="inp" id="nm" value="${esc(st.name)}" autocomplete="name"></div>
      <div class="field"><label for="ph">${t("phone")}</label><input class="inp" id="ph" value="${esc(st.phone)}" inputmode="tel" placeholder="09xx xxx xxx" autocomplete="tel"></div>
      <div id="err">${wn?"":`<div class="warn">${t("noWa")}</div>`}</div></div>
    <div class="sh-f"><div class="sum"><b>${gs(cartTot())}</b><small>${nItems(cartN())}</small></div><button class="btn" data-send-order="1" ${wn&&its.length?"":"disabled"}>${ic("chat")}${t("orderSend")}</button></div></div></div>`;
}
function sendOrder(){
  st.name=$("#nm").value.trim();st.phone=$("#ph").value.trim();
  if(!st.name||!st.phone){$("#err").innerHTML=`<div class="warn">${t("need")}</div>`;(st.name?$("#ph"):$("#nm")).focus();return}
  try{localStorage.setItem("reserva_me",JSON.stringify({name:st.name,phone:st.phone}))}catch(e){}
  const msg=t("waOrder").replace("{salon}",SALON.name).replace("{p}",cartItems().map(i=>"• "+i.qty+"× "+i.name+" · "+gs(i.price*i.qty)).join("\n")).replace("{t}",gs(cartTot())).replace("{name}",st.name).replace("{phone}",st.phone);
  window.open("https://wa.me/"+waNum(SALON.phone)+"?text="+encodeURIComponent(msg),"_blank","noopener");
  st.sent=true;renderSheet();
}
function showPrivacy(){$("#layer").innerHTML=`<div class="ov" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="${t("privacy")}"><h3>${t("privacy")}</h3><p>${esc(t("privacyT").replace("{salon}",SALON.name))}</p><button class="btn" id="ovx">${t("close")}</button></div></div>`;
  $("#ovx").onclick=()=>$("#layer").innerHTML="";$("#ov").onclick=e=>{if(e.target.id==="ov")$("#layer").innerHTML=""}}
function openSheet(step){st.sheet=true;st.sent=false;st.mode="book";st.step=step||0;render()}
function closeSheet(){if(st.sent){Object.assign(st,{svc:[],pro:"any",date:null,time:null,sent:false,cart:{}})}st.sheet=false;st.mode="book";render()}
function confirm(){
  st.name=$("#nm").value.trim();st.phone=$("#ph").value.trim();
  if(!st.name||!st.phone){$("#err").innerHTML=`<div class="warn">${t("need")}</div>`;(st.name?$("#ph"):$("#nm")).focus();return}
  try{localStorage.setItem("reserva_me",JSON.stringify({name:st.name,phone:st.phone}))}catch(e){}
  if(st.pro==="any"){const p=freePro(st.date,toMin(st.time));if(p)st.pro=p.id}
  const b=$("[data-confirm]");b.disabled=true;
  cloudSave().then(ok=>{if(!ok){b.disabled=false;$("#err").innerHTML=`<div class="warn">${t("fail")}</div>`;return}st.sent=true;renderSheet()});
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-shade]");if(!b)return;const d=b.dataset;
  if(d.shade){if(e.target===b&&window.innerWidth>=700)closeSheet();return}
  if(b.disabled)return;
  const nm=$("#nm");if(nm){st.name=nm.value;st.phone=$("#ph").value}
  if(d.l){st.lang=d.l;try{localStorage.setItem("reserva_lang",d.l)}catch(x){}render()}
  else if(d.themeBtn){THEME=isDark()?"light":"dark";try{localStorage.setItem("reserva_theme",THEME)}catch(x){}applyTheme();render()}
  else if(d.tab){st.tab=d.tab;render();const tb=$(".tabs");if(tb&&tb.getBoundingClientRect().top>60)tb.scrollIntoView({behavior:"smooth"})}
  else if(d.cat){st.cat=d.cat;render()}
  else if(d.book){if(!st.svc.includes(d.book))st.svc.push(d.book);st.time=null;if(st.pro!=="any"&&!canDo(PROS.find(p=>p.id===st.pro)||{}))st.pro="any";openSheet(0)}
  else if(d.proStart){st.pro=d.proStart;st.svc=st.svc.filter(id=>{const p=PROS.find(x=>x.id===d.proStart);return !p.svc||p.svc.includes(id)});st.time=null;openSheet(0)}
  else if(d.open){openSheet(0)}
  else if(d.close){closeSheet()}
  else if(d.back){if(st.step===0)closeSheet();else{st.step--;renderSheet()}}
  else if(d.next){st.step++;renderSheet();$(".sh-b").scrollTop=0}
  else if(d.svc){const i=st.svc.indexOf(d.svc);i<0?st.svc.push(d.svc):st.svc.splice(i,1);st.time=null;if(st.pro!=="any"&&!canDo(PROS.find(p=>p.id===st.pro)||{}))st.pro="any";render()}
  else if(d.pro){st.pro=d.pro;st.time=null;renderSheet()}
  else if(d.date){st.date=d.date;st.time=null;renderSheet()}
  else if(d.time){st.time=d.time;renderSheet();const f=$(".sh-f .btn");if(f)f.focus()}
  else if(d.quick){const[a,c]=d.quick.split("|");st.date=a;st.time=c;st.step=2;renderSheet()}
  else if(d.confirm){confirm()}
  else if(d.add||d.inc||d.dec){const id=d.add||d.inc||d.dec,p=PRODUCTS.find(x=>x.id===id);
    if(d.dec){const q=(st.cart[id]||0)-1;if(q>0)st.cart[id]=q;else delete st.cart[id]}else if(p&&(st.cart[id]||0)<p.stock)st.cart[id]=(st.cart[id]||0)+1;
    if(st.sheet){if(st.mode==="order"&&!cartN())return closeSheet();const sb=$(".sh-b"),y=sb?sb.scrollTop:0,up=$(".upsell"),x=up?up.scrollLeft:0;renderSheet();const sb2=$(".sh-b");if(sb2)sb2.scrollTop=y;const up2=$(".upsell");if(up2)up2.scrollLeft=x}
    else{const y=scrollY;render();scrollTo(0,y)}}
  else if(d.order){st.sheet=true;st.sent=false;st.mode="order";render()}
  else if(d.sendOrder){sendOrder()}
  else if(d.privacy){showPrivacy()}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#q");i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#layer").innerHTML)$("#layer").innerHTML="";else if(st.sheet)closeSheet()}});
applyTheme();applyBrand();
render();
cloudLoad();
/* Plan y funciones que define el admin de Araújo Tech (llega por licencia.js) */
function applyLic(d){if(!d||!d.plan)return;const P0={esencial:2,crecimiento:6,premium:0};PLAN_PROS=d.pros!=null&&!isNaN(+d.pros)?+d.pros:(P0[d.plan]||0);PLAN_SHOP=d.feats&&"shop" in d.feats?!!d.feats.shop:d.plan!=="esencial";if(!PLAN_SHOP&&st.tab==="shop")st.tab="svc";if(!PLAN_SHOP)st.cart={};cloudLoad();render()}
window.addEventListener("atlic",e=>applyLic(e.detail));if(window.ATLIC)applyLic(window.ATLIC);
})();
</script>
</body>
</html>
