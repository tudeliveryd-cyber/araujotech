 for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx>235&&mn>235)continue;n++;if(mx<60){dk++;continue}const sat=(mx-mn)/mx;if(sat<.25)continue;const k=(r>>4)+','+(g>>4)+','+(b>>4);B[k]=(B[k]||0)+sat}
 let best=null,bv=0;for(const k in B)if(B[k]>bv){bv=B[k];best=k}
 if(n&&dk/n>.5){cb('#141414');return}if(!best){cb(null);return}const q=best.split(',').map(v=>Math.min(255,v*16+8));let [r,g,b]=q;const L=(.299*r+.587*g+.114*b);if(L>150){r=Math.round(r*.6);g=Math.round(g*.6);b=Math.round(b*.6)}cb('#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''))}catch(e){cb(null)}};im.onerror=()=>cb(null);im.src=src}
