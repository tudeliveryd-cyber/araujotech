.photo{position:relative;border-radius:calc(var(--r) * 1.6);overflow:hidden;aspect-ratio:4/4.6;background:var(--paper);box-shadow:0 30px 70px -30px color-mix(in srgb,var(--ac) 45%,transparent),0 0 0 1px var(--line)}

.photo img{width:100%;height:100%;object-fit:cover}

.sec{padding:96px 0;border-top:1px solid var(--line)}
.sec.alt{background:var(--paper);border-top:0}
.split{display:grid;grid-template-columns:.8fr 1.2fr;gap:64px}

 ${prods.length>=2?`<section class="sec" id="productos"><div class="w"><div class="prodhd rv"><h2>${l.prods}</h2>${s.cat?`<a class="btn out sm" href="${esc(s.cat)}" target="_blank" rel="noopener">${l.prods_all}${ic('arrow')}</a>`:''}</div><div class="prods">${prods.map(p=>{const nm=(lang==='pt'?p.n.pt:p.n.es)||p.n.es||p.n.pt;const pr=p.promo>0&&p.promo<p.price?p.promo:p.price;const u=s.cat?String(s.cat).replace(/[?#].*$/,'')+'?p='+encodeURIComponent(p.id):'';return `<${u?`a href="${esc(u)}" target="_blank" rel="noopener"`:'div'} class="pc rv"><span class="pi"><img src="${esc((String(p.img)[0]==='/'?AB:'')+p.img)}" alt="${esc(nm)}" loading="lazy"></span><span class="pb"><b>${esc(nm)}</b>${pr>0?`<span class="pp"><strong>${fmtPrice(pr,PR.cur)}</strong>${pr<p.price?`<s>${fmtPrice(p.price,PR.cur)}</s>`:''}</span>`:''}</span></${u?'a':'div'}>`}).join('')}</div></div></section>`:''}
 ${s.about?`<section class="sec" id="nosotros"><div class="w split"><div><h2>${l.about}</h2></div><div class="about"><p>${esc(s.about)}</p>${g[0]?`<div class="pic"><img src="${g[0]}" alt="" loading="lazy"></div>`:''}</div></div></section>`:''}
 ${svc.length?`<section class="sec alt" id="servicios"><div class="w split"><div><h2>${tx.svc||l.svc}</h2></div><div class="list">${svc.map((x,i)=>`<div class="item"><span>${String(i+1).padStart(2,'0')}</span><b>${esc(x[0])}</b>${x[1]?`<p>${esc(x[1])}</p>`:''}</div>`).join('')}</div></div></section>`:''}
 ${g.length>(s.about?1:0)?`<section class="sec"><div class="w"><h2>${l.gal}</h2><div class="gal">${g.slice(s.about?1:0).map(u=>`<img src="${u}" alt="" loading="lazy">`).join('')}</div></div></section>`:''}
 ${hr.length||s.addr?`<section class="sec${svc.length&&g.length<=(s.about?1:0)?'':''}" id="horarios"><div class="w"><h2>${l.visit}</h2><div class="visit"><div>
   ${hr.length?`<div class="hrs">${hr.map(([a,b])=>{const td=daysIn(a).includes(new Date().getDay());const cl=closedTxt(b)||!b;return `<div class="hr${td?' td':''}"><span>${esc(a)}${td?`<em>${l.hoy}</em>`:''}</span><b class="${cl?'cl':''}">${cl?esc(b||l.closed):shiftsHTML(b)}</b></div>`}).join('')}</div>`:''}
   ${s.addr?`<div class="addr"><small>${l.addr}</small><b>${esc(s.addr)}</b>${ml?`<a class="btn out sm" href="${ml}" target="_blank" rel="noopener">${ic('pin')}${l.how}</a>`:''}</div>`:''}</div>
   ${ms?`<div class="map"><iframe src="${ms}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="${l.how}"></iframe></div>`:''}</div></div></section>`:''}
 <section class="sec alt" id="contacto"><div class="w contact"><div><h2>${esc(tx.q)}</h2>${s.wa?`<p>${l.reply} · ${esc(waShow(s.wa))}</p>`:''}</div>${waL?`<a class="btn pri" href="${waL}" target="_blank" rel="noopener">${ic('chat')}${esc(tx.call)}</a>`:''}</div></section>
 <footer><div class="w"><div class="cols">
  <div><b class="n">${esc(name)}</b>${s.tag?`<p>${esc(s.tag)}</p>`:''}</div>
  <div><h4>${l.contact}</h4>${s.wa?`<a class="ln" href="${waL}" target="_blank" rel="noopener">${ic('phone')}<span>${esc(waShow(s.wa))}</span></a>`:''}${s.email?`<a class="ln" href="mailto:${esc(s.email)}">${ic('mail')}<span>${esc(s.email)}</span></a>`:''}${s.addr?`<div class="ln">${ic('pin')}<span>${esc(s.addr)}</span></div>`:''}</div>
  <div>${ig||fb?`<h4>${l.follow}</h4>${ig?`<a class="ln" href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener">${ic('ig')}<span>@${esc(ig)}</span></a>`:''}${fb?`<a class="ln" href="${esc(fb)}" target="_blank" rel="noopener">${ic('fb')}<span>Facebook</span></a>`:''}`:''}</div>
 </div><div class="bot"><span>© ${new Date().getFullYear()} ${esc(name)}</span><span>${l.by} <a href="https://araujotechsistemas.com/" target="_blank" rel="noopener">Araújo Tech Sistemas</a></span></div></div></footer>
 ${waL?`<a class="fab" href="${waL}" target="_blank" rel="noopener" aria-label="WhatsApp">${WA}</a>`:''}
 <div class="lb" id="lb"><img alt=""></div>`;
 document.querySelectorAll('.sec .split>div,.sec>.w>h2,.visit,.contact,.gal').forEach(x=>x.classList.add('rv'));
 if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'});document.querySelectorAll('.rv').forEach(x=>io.observe(x))}else document.querySelectorAll('.rv').forEach(x=>x.classList.add('in'));
 const hd=document.getElementById('hd');const h1w=document.querySelector('.h1wm');const onS=()=>{hd.classList.toggle('b',scrollY>8);if(h1w)hd.classList.toggle('lg',h1w.getBoundingClientRect().bottom<hd.offsetHeight)};addEventListener('scroll',onS,{passive:true});onS();
 const lb=document.getElementById('lb');document.querySelectorAll('.gal img').forEach(im=>im.addEventListener('click',()=>{lb.querySelector('img').src=im.src;lb.classList.add('on')}));lb.addEventListener('click',()=>lb.classList.remove('on'));
}
main();
})();
</script>
