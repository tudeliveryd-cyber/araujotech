<html lang="es">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#ffffff">

<style>
:root{--bg:#F6F6F8;--card:#fff;--ink:#16151C;--mute:#6B6A75;--line:#E4E3EA;--ac:#6D28D9;--ac2:#5B21B6;--ok:#15803D;--err:#B91C1C;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top .in{max-width:860px;margin:0 auto;padding:0 18px;height:62px;display:flex;align-items:center;gap:12px}
.top b{font-size:16px}.top small{color:var(--mute);display:block;font-size:12.5px;line-height:1.2}
.top .sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;padding:5px 9px;font-size:12px;font-weight:600;color:var(--mute);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.wrap{max-width:860px;margin:0 auto;padding:22px 18px 120px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px}
.card h2{font-size:17px;display:flex;align-items:center;gap:10px}
.card h2 svg{color:var(--ac)}
.card .sub{color:var(--mute);font-size:13.5px;margin-top:-10px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:13px;font-weight:600}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgb(109 40 217 / .14)}
textarea.inp{resize:vertical;min-height:96px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{font-size:12.5px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:#FAFAFC}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.pri:hover{background:var(--ac2)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.btn.ic{width:36px;padding:0}
.btn[disabled]{opacity:.55;cursor:default}
.rows{display:flex;flex-direction:column;gap:8px}
.r{display:grid;gap:8px;align-items:center}
.r.svc{grid-template-columns:1fr 1.3fr 36px}
.r.hr{grid-template-columns:.75fr 1.4fr 36px}
.tpls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tpl{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.tpl[aria-pressed=true]{border-color:var(--ac);box-shadow:0 0 0 3px rgb(109 40 217 / .12)}
.tpl i{display:block;height:34px;border-radius:7px}
.tpl b{font-size:13px}
.photos{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.ph{position:relative;width:104px;height:104px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#F1F0F5}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.logo img{object-fit:contain;padding:8px;background:#fff}
.ph button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.ph button svg{width:14px;height:14px}
.add{width:104px;height:104px;border-radius:12px;border:1.5px dashed #C9C7D3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;text-align:center;padding:6px}
.add:hover{border-color:var(--ac);color:var(--ac)}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:#F1F0F5;color:var(--mute);font-weight:600}
.pill.auto{background:#EEF2FF;color:#4338CA}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:10;padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .st{flex:1;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:#A3A3AD;flex:none}.dot.ok{background:var(--ok)}.dot.dirty{background:#D97706}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:22px}.login p{color:var(--mute);font-size:14px;margin-top:-6px}
.err{color:var(--err);font-size:13px;min-height:18px}
.url{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.url a{color:var(--ac);font-weight:600;text-decoration:none;word-break:break-all}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:30;display:none}
.toast.on{display:block}.toast.bad{background:var(--err)}
.empty{text-align:center;padding:60px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{color:var(--mute);max-width:420px}
@media (max-width:640px){.row2{grid-template-columns:1fr}.tpls{grid-template-columns:1fr 1fr}.r.svc{grid-template-columns:1fr 36px}.r.svc .d{grid-column:1}.r.svc .x{grid-row:1/3;grid-column:2}.bar .st span{display:none}}
</style>
</head>

  <div class="row2">${fld('ig',t('ig'),{ph:'@usuario'})}${fld('fb',t('fb'),{ph:'facebook.com/…'})}</div></div>
 <div class="card"><h2>${ic('img')}${t('photos')}</h2>
  <div class="fld"><span class="lbl">${t('hero')} ${ph.h&&!ph.hc&&ph.hh?`<span class="pill auto">${t('auto')}</span>`:!ph.h?`<span class="pill">${t('sample')}</span>`:''}</span><div class="photos">${photo('sh')}${upBtn('sh',t('up'))}</div><span class="note">${t('hero_note')}</span></div>
  <div class="fld"><span class="lbl">${t('logo')} ${ph.l&&!ph.lc&&ph.lh?`<span class="pill auto">${t('auto')}</span>`:''}</span><div class="photos">${photo('sl','logo')}${upBtn('sl',t('up'))}</div><span class="note">${t('logo_note')}</span></div>
  <div class="fld"><span class="lbl">${t('gal')} <span class="pill">${+ph.g||0}/8</span></span><div class="photos">${Array.from({length:+ph.g||0},(_,i)=>photo('sg'+i)).join('')}${(+ph.g||0)<8?upBtn('sg',t('up')):''}</div><span class="note">${t('gal_note')}</span></div></div>
 <div class="card"><h2>${ic('brush')}${t('look')}</h2>
  <div class="fld"><span class="lbl">${t('style')}</span><div class="tpls">${Object.keys(TPLC).map(k=>`<button type="button" class="tpl" data-act="tpl" data-k="${k}" aria-pressed="${site.tpl===k}"><i style="background:linear-gradient(90deg,${TPLC[k][0]} 0 55%,${TPLC[k][1]} 55%);border:1px solid var(--line)"></i><b>${t('tpl')[k]}</b></button>`).join('')}</div></div>
  <div class="row2"><div class="fld"><label for="f_color">${t('color')}</label><div style="display:flex;gap:10px;align-items:center"><input id="f_color" type="color" data-f="color" value="${esc(site.color||TPLC[site.tpl]?.[1]||'#1D4ED8')}" style="width:52px;height:42px;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff">${site.color?`<button class="btn sm" data-act="coldef">${t('color_def')}</button>`:`<span class="note">${t('color_auto')}</span>`}</div></div>
  <div class="fld"><label for="f_lang">${t('lang')}</label><select id="f_lang" class="inp" data-f="lang"><option value="es" ${site.lang!=='pt'?'selected':''}>Español</option><option value="pt" ${site.lang==='pt'?'selected':''}>Português</option></select></div></div></div>
 </div>
 <div class="bar"><div class="in"><div class="st"><i class="dot ${dirty?'dirty':'ok'}" id="stDot"></i><span id="stTxt">${saving?t('saving'):dirty?t('dirty'):t('saved')}</span></div><a class="btn" href="${url}" target="_blank" rel="noopener">${ic('eye')}${t('view')}</a><button class="btn pri" data-act="save" ${saving?'disabled':''}>${t('save')}</button></div></div>`}
function setDirty(v){dirty=v;const d=document.getElementById('stDot'),x=document.getElementById('stTxt');if(d)d.className='dot '+(v?'dirty':'ok');if(x)x.textContent=saving?t('saving'):v?t('dirty'):t('saved')}
function readSvc(){site.svc=[...document.querySelectorAll('#svcRows .r')].map(r=>{const a=r.querySelector('[data-p="0"]').value.trim(),b=r.querySelector('[data-p="1"]').value.trim();return a?(b?a+' | '+b:a):''}).filter(Boolean)}
function readHr(){site.hours=[...document.querySelectorAll('#hrRows .r')].map(r=>{const a=r.querySelector('[data-p="0"]').value.trim(),b=r.querySelector('[data-p="1"]').value.trim();return a&&b?a+': '+b:a||b}).filter(Boolean).join('\n')}
function resize(file,max,keepPng){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext('2d');if(!keepPng){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);
  if(keepPng){const u=c.toDataURL('image/png');if(u.length<700000){res(u);return}}let q=.84,u;do{u=c.toDataURL('image/jpeg',q);q-=.1}while(u.length>850000&&q>.4);res(u)};im.src=fr.result};fr.readAsDataURL(file)})}
const syncRows=()=>{if(document.getElementById('svcRows')){readSvc();readHr()}};
async function upload(k,file){syncRows();try{const isLogo=k==='sl';const u=await resize(file,isLogo?800:k==='sh'?1800:1400,isLogo&&/png|svg|webp/.test(file.type));if(u.length>950000){toast(t('big'),true);return}
 const ph=site.ph;let key=k;if(k==='sg'){if((+ph.g||0)>=8)return;key='sg'+(+ph.g||0)}
 toast(t('saving'));await API.putImg(SHOP,key,u);imgs[key]=u;if(k==='sh'){ph.h=1;ph.hc=1}else if(k==='sl'){ph.l=1;ph.lc=1}else ph.g=(+ph.g||0)+1;ph.v=Date.now();
 await API.putSite(SHOP,{ph});render();toast(t('photo_ok'))}catch(e){console.warn(e);toast(t('err'),true)}}
async function removeImg(k){syncRows();const ph=site.ph;try{if(k.startsWith('sg')){const i=+k.slice(2),n=+ph.g||0;for(let j=i;j<n-1;j++){await API.putImg(SHOP,'sg'+j,imgs['sg'+(j+1)]);imgs['sg'+j]=imgs['sg'+(j+1)]}await API.delImg(SHOP,'sg'+(n-1));delete imgs['sg'+(n-1)];ph.g=n-1}
 else{await API.delImg(SHOP,k);delete imgs[k];if(k==='sh'){ph.h=0;ph.hc=0;ph.hh=''}else{ph.l=0;ph.lc=0;ph.lh=''}}ph.v=Date.now();await API.putSite(SHOP,{ph});render()}catch(e){console.warn(e);toast(t('err'),true)}}
async function save(){readSvc();readHr();saving=true;render();
 const o={};['name','city','tag','about','svc','hours','wa','email','addr','maps','cat','ig','fb','color','lang','tpl'].forEach(k=>o[k]=site[k]==null?'':site[k]);o.updated=new Date().toISOString();o.by='cliente';
 try{await API.putSite(SHOP,o);saving=false;dirty=false;render();toast(t('saved_t'))}catch(e){console.warn(e);saving=false;render();toast(t('err'),true)}}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f){site[el.dataset.f]=el.value;setDirty(true)}else if(el.dataset.svc!=null||el.dataset.hr!=null)setDirty(true)});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.up&&el.files&&el.files[0]){await upload(el.dataset.up,el.files[0]);el.value=''}else if(el.dataset.f==='color'){syncRows();render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act],[data-lang]');if(!b)return;
 if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('at_site_lang',lang)}catch(er){}if(site){readSvc();readHr();render()}else if(lastEmpty)location.reload();else loginView();return}
 const a=b.dataset.act;
 if(a==='logout'){if(dirty&&!confirm(t('leave')))return;dirty=false;await API.logout();return}
 if(a==='save'){save();return}
 if(a==='addsvc'){syncRows();site.svc.push('');render();const r=document.querySelectorAll('#svcRows .r');r[r.length-1].querySelector('input').focus();setDirty(true);return}
 if(a==='rmsvc'){readSvc();const rows=[...document.querySelectorAll('#svcRows .r')];rows[+b.dataset.i]?.remove();readSvc();render();setDirty(true);return}
 if(a==='addhr'){syncRows();addHr=true;render();const r=document.querySelectorAll('#hrRows .r');r[r.length-1].querySelector('input').focus();return}
 if(a==='rmhr'){const rows=[...document.querySelectorAll('#hrRows .r')];rows[+b.dataset.i]?.remove();readHr();render();setDirty(true);return}
 if(a==='tpl'){syncRows();site.tpl=b.dataset.k;render();setDirty(true);return}
 if(a==='coldef'){site.color='';render();setDirty(true);return}
 if(a==='rmimg'){removeImg(b.dataset.k);return}});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
boot();
</script>
</body>
</html>
