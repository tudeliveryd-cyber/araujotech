<style>
/* Layout: plataforma (barra Araújo Tech) envolvendo um catálogo-inquilino com tema próprio; painel em duas colunas com pré-visualização ao vivo */
:root{
  --bg:#F4F3F2; --surface:#FFFFFF; --fg:#1B1817; --muted:#6E6866; --line:#E6E2E0; --soft:#EFECEA;
  --accent:#7E22CE; --accent-ink:#FFFFFF; --brand:#7E22CE; --ok:#15803D; --warn:#B45309; --bad:#B91C1C;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141211; --surface:#1E1B1A; --fg:#F2EEEC; --muted:#A39C99; --line:#332E2C; --soft:#272322;
  --accent:#B97CFF; --accent-ink:#17082B; --brand:#B97CFF; --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141211; --surface:#1E1B1A; --fg:#F2EEEC; --muted:#A39C99; --line:#332E2C; --soft:#272322;

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none;display:block}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- Barra da plataforma ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;font-size:15px;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}.brand .bt-t{color:var(--brand)}
.brand small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.sync.err{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.track{background:var(--t-card);color:var(--t-text);border:1px solid color-mix(in srgb,var(--t-primary) 35%,transparent);border-radius:var(--t-r2,16px);padding:14px 16px;margin:0 0 14px;display:flex;flex-direction:column;gap:12px}
.track-h{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}.track-h span{font-weight:600;color:var(--t-primary)}
.tsteps{display:flex;gap:6px}.tstep{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11.5px;opacity:.55;min-width:0}
.tstep i{height:5px;border-radius:5px;background:color-mix(in srgb,var(--t-text) 15%,transparent)}.tstep.on{opacity:1}.tstep.on i{background:var(--t-primary)}.tstep.cur span{font-weight:700}
.track-eta{margin:0;display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600}
a.btn{text-decoration:none}
.grid.t{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@container (min-width:620px){.grid.t{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (min-width:900px){.grid.t{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grid.t .pcard{flex-direction:column-reverse!important}
.grid.t .pthumb{width:auto!important;height:auto!important;aspect-ratio:1/1;margin:8px 8px 0!important;align-self:stretch!important}
.grid.t .px{padding:10px 12px 12px}
.grid.t .pname{font-size:14px}
.grid.t .pdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px}
.grid.t .prow{margin-top:auto}
.unit{font-size:.75em;font-weight:600;opacity:.7;margin-left:2px}
.pbadge.rx{background:color-mix(in srgb,var(--t-text) 12%,transparent)!important;color:var(--t-text)!important;display:inline-flex;align-items:center;gap:3px}
.ramos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.ramo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px;min-height:74px;line-height:1.2;font-size:12px!important;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-weight:600;font-size:13px;text-align:center}

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {

                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

 const it={};cur.forEach(o=>(o.items||[]).forEach(i=>{const n=String(i.n||'').split(' + ')[0];if(n)it[n]=(it[n]||0)+(+i.q||0)}));const top=Object.entries(it).sort((a,b)=>b[1]-a[1]).slice(0,3);

 const s=sum(cur),ps=sum(prev);return{n:cur.length,sales:s,prevSales:ps,pct:ps?Math.round((s-ps)/ps*100):null,ticket:cur.length?s/cur.length:0,top,newC,best:bd?{d:+bd[0],v:bd[1]}:null}}

  const B={},dark={n:0,r:0,g:0,b:0};for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const r=d[i],g=d[i+1],b=d[i+2];const [h,s,l]=hsl(r,g,b);

const TW=()=>{const k=(pub&&pub.store&&pub.store.tableWord)||'mesa';return k==='otro'?twName(k,pub.store.tableTxt):(t('tw_'+k)||t('pos_table'))};

function salonOn(){return !limOff('mesas')&&placeGroups().length>0}
function admTabs(){const l=[['resumo','chart'],['caja','cash'],['orders','list'],['cocina','flame'],['salon','bell'],['clientes','users'],['products','box'],['custom','palette'],['delivery','map'],['ads','layers']].filter(([k])=>tabOk(k)&&(k!=='salon'||salonOn()));
 if(myRole()==='mozo')l.sort((a,b)=>(b[0]==='salon')-(a[0]==='salon'));return l}
const salAge=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/60000));
function salReady(){return orders.filter(o=>o.mesa&&o.status==='pronto'&&!o.ex&&salMine(o.mesa)).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function salCalls(){return CALLS.filter(c=>c.status==='aguardando'&&salMine(c.mesa)&&Date.now()-new Date(c.date)<4*3600e3).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function salOpen(){const m={},from=Date.now()-14*3600e3;orders.forEach(o=>{if(o.canal!=='mesa'||!o.mesa||!salMine(o.mesa)||o.ex||o.paid||o.status==='cancelado'||new Date(o.date)<from)return;
  const g=m[o.mesa]||(m[o.mesa]={mesa:o.mesa,l:[],tot:0,pays:[],names:[],prep:0});g.l.push(o);g.tot+=+o.total||0;if(o.pay&&!g.pays.includes(o.pay))g.pays.push(o.pay);
  const nm=String(o.name||'').trim();if(nm&&!nm.endsWith(' '+o.mesa)&&!g.names.includes(nm))g.names.push(nm);if(!['pronto','retirado','entregue'].includes(o.status))g.prep++});
 return Object.values(m).sort((a,b)=>String(a.mesa).localeCompare(String(b.mesa),undefined,{numeric:true}))}

  <div style="display:flex;gap:8px;align-items:center">${ic(c.call==='cuenta'?'receipt':'bell',18)}<span><b>${t('sal_call_'+c.call)}</b>${c.pay?` · ${esc(t(c.pay))}`:''}${c.name?`<br><small class="muted">${esc(c.name)}</small>`:''}</span></div>

 const open=`<div class="card"><h3>${ic('receipt',18)}${t('sal_open')}</h3>${op.length?op.map(g=>`<div class="srow"><div><b class="m">${esc(mesaL(g.mesa))}</b> · <b class="num">${gs(g.tot)}</b>

function qrCanvas(size){const m=qrMatrix(CAT_URL),n=m.length,q=4,cell=Math.max(1,Math.floor(size/(n+q*2))),dim=cell*(n+q*2);const c=document.createElement('canvas');c.width=c.height=dim;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,dim,dim);x.fillStyle='#141414';for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(m[r][k])x.fillRect((k+q)*cell,(r+q)*cell,cell,cell);return c}
