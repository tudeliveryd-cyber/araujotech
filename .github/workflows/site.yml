name: Publicar site Araújo Tech

on:
  push:
    branches: [main]
    paths:
      - 'araujo-tech-site/**'
      - 'index.html'
      - 'tools/make_demo.py'
      - 'admin/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      SITE_FTP_USERNAME: ${{ secrets.SITE_FTP_USERNAME }}
      SITE_FTP_PASSWORD: ${{ secrets.SITE_FTP_PASSWORD }}
    steps:
      - name: Aguardando os dados do FTP do site
        if: env.SITE_FTP_USERNAME == '' || env.SITE_FTP_PASSWORD == ''
        run: echo "Faltam SITE_FTP_USERNAME e SITE_FTP_PASSWORD nos secrets. Nada foi enviado."
      - uses: actions/checkout@v4
        if: env.SITE_FTP_USERNAME != '' && env.SITE_FTP_PASSWORD != ''
      - name: Instalar lftp
        if: env.SITE_FTP_USERNAME != '' && env.SITE_FTP_PASSWORD != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Gerar a demonstração (Casa Brasa) a partir do catálogo atual
        if: env.SITE_FTP_USERNAME != '' && env.SITE_FTP_PASSWORD != ''
        run: python3 tools/make_demo.py
      - name: Enviar arquivos para araujotechsistemas.com
        if: env.SITE_FTP_USERNAME != '' && env.SITE_FTP_PASSWORD != ''
        run: |
          export LFTP_PASSWORD="$SITE_FTP_PASSWORD"
          # Só envia o conteúdo de araujo-tech-site/. Sem --delete: nada no servidor é apagado
          # (a pasta fogaomineiro, php.ini e afins ficam intactos).
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:verify-certificate/CC:40:F0:6A:08:0C:63:04:01:05:A9:20:7B:23:53:CA:60:35:A7:05 no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u "$SITE_FTP_USERNAME" ftp://$FTP_SERVER;
            mirror --reverse --verbose --only-newer --parallel=3 \
              --exclude-glob fogaomineiro/ \
              ./araujo-tech-site/ ./;
            bye"
      - name: Endereços dos sites dos clientes (araujotechsistemas.com/nome)
        if: env.SITE_FTP_USERNAME != '' && env.SITE_FTP_PASSWORD != ''
        run: |
          export LFTP_PASSWORD="$SITE_FTP_PASSWORD"
          L="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ssl:verify-certificate/CC:40:F0:6A:08:0C:63:04:01:05:A9:20:7B:23:53:CA:60:35:A7:05 no; set ftp:passive-mode true; set net:max-retries 3; set net:timeout 30; open --env-password -u $SITE_FTP_USERNAME ftp://$FTP_SERVER"
          rm -f ht_old
          # Baixa o .htaccess que já existe (o do cPanel) para não perder nada dele.
          if ! lftp -e "$L; get .htaccess -o ht_old; bye"; then
            if lftp -e "$L; cls -1 .htaccess; bye" 2>/dev/null | grep -q htaccess; then
              echo "Existe .htaccess mas não deu para baixar. Não mexo nele."; exit 1
            fi
            : > ht_old
          fi
          # Tira o bloco antigo (se houver) e coloca o atual no fim.
          awk '/^# BEGIN araujotech-sitios/{skip=1} !skip{print} /^# END araujotech-sitios/{skip=0}' ht_old > ht_new
          cat >> ht_new <<'HT'
          # BEGIN araujotech-sitios
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteCond %{HTTP_HOST} ^(www\.)?araujotechsistemas\.com$ [NC]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^([a-z0-9][a-z0-9-]+)/?$ /sitio/index.php [L]
          </IfModule>
          <IfModule mod_headers.c>
          Header always set X-Content-Type-Options "nosniff"
          Header always set Referrer-Policy "strict-origin-when-cross-origin"
          <FilesMatch "\.(html|json|js)$">
          Header set Cache-Control "no-cache"
          </FilesMatch>
          <FilesMatch "\.(png|jpe?g|webp|svg|ico|woff2?)$">
          Header set Cache-Control "public, max-age=604800"
          </FilesMatch>
          </IfModule>
          # END araujotech-sitios
          HT
          sed -i 's/^          //' ht_new
          echo "----- .htaccess final -----"; cat ht_new
          if cmp -s ht_old ht_new; then echo "Sem mudanças"; exit 0; fi
          lftp -e "$L; put ht_new -o .htaccess; bye"
