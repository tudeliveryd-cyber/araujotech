name: diag-pw (somente leitura, roda um script de tools/diag com Playwright)
on:
  workflow_dispatch:
    inputs:
      script: { default: 'cls.js' }
      arg: { default: 'https://guiadesantarita.com/' }
      dev: { default: 'Pixel 5' }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: DEV="${{ inputs.dev }}" node tools/diag/${{ inputs.script }} "${{ inputs.arg }}"
