name: tmp limpar
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - run: git ls-remote --exit-code "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" refs/heads/tmp/ferramentas-teste && git init -q x && cd x && git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" --delete tmp/ferramentas-teste
