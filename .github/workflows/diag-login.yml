name: Diagnóstico do login do painel

# Só leitura: abre o painel e testa o login com um usuário que não existe.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/diag_login.js
