name: Flyers do horário (Guía)

# Só leitura: gera os flyers de desayuno, almuerzo, merienda e cena com os negócios reais da Guía.
on:
  workflow_dispatch:
    inputs:
      idioma:
        description: 'Idioma (es/pt)'
        default: 'es'

jobs:
  flyer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/flyer_horario.js
        env:
          GLANG: ${{ inputs.idioma }}
      - uses: actions/upload-artifact@v4
        with:
          name: flyers
          path: flyers/
