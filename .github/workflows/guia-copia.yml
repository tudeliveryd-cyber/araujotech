name: Copia da Guía a partir da cópia de segurança (só leitura)

# Lê as cópias de segurança automáticas e mostra o que a Guía (platform/sitio) tinha em cada uma.
# Imprime no registro (GUIA64) o conteúdo da Guía da cópia escolhida, para restaurar pelo painel. Não grava nada.
on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Id da execução da cópia (backup.yml) a imprimir'
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
        run: |
          for id in $(gh run list -w backup.yml -L 5 --json databaseId -q '.[].databaseId'); do
            gh run download $id -D b$id || { echo "SEM $id"; continue; }
            f=$(find b$id -name '*.json' | head -1)
            python3 - "$f" "$id" "$RUN" <<'PY'
          import json,sys,base64
          d=json.load(open(sys.argv[1])); s=[x for x in d.get('sitio',[]) if x.get('_id')=='sitio']
          if not s: print('COPIA',sys.argv[2],d.get('at'),'sem sitio'); sys.exit()
          s=s[0]; keys=[k for k in s if k.startswith('g')]
          def n(v): return len(v) if isinstance(v,(list,dict)) else (1 if v else 0)
          print('COPIA',sys.argv[2],d.get('at'),' '.join('%s=%d'%(k,n(s[k])) for k in sorted(keys)))
          if sys.argv[3]==sys.argv[2]:
            g={k:s[k] for k in keys}; b=base64.b64encode(json.dumps(g,ensure_ascii=False).encode()).decode()
            print('GUIASIZE',len(b))
            for i in range(0,len(b),60000): print('GUIA64 '+b[i:i+60000])
          PY
          done
