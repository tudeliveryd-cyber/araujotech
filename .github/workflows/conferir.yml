name: Conferir no ar

# Abre os sites oficiais e testa as regras do Firebase em produção (só leitura, não altera nada).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publicar site Araújo Tech", "Publicar catálogo Fogão Mineiro"]
    types: [completed]
  schedule:
    - cron: '17 11 * * *'

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir sites, cabeçalhos, certificados e regras
        run: bash tools/conferir_no_ar.sh
