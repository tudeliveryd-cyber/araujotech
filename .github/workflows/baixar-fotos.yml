name: baixar-fotos (candidatas de foto do Unsplash para um ramo de proposta)
on:
  workflow_dispatch:
    inputs:
      ramo: { default: 'proposta-atalhos-guia' }
      lista: { description: 'nome=id-da-foto separados por espaço', default: '' }
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ramo }}' }
      - run: |
          mkdir -p tools/fotos-cand
          for x in ${{ inputs.lista }}; do n="${x%%=*}"; id="${x#*=}"
            curl -sSL -m 40 "https://images.unsplash.com/photo-$id?auto=format&fit=crop&w=1200&q=80&fm=jpg" -o "tools/fotos-cand/$n.jpg" || echo "falhou $n"
            file "tools/fotos-cand/$n.jpg"; done
          git config user.name "Araújo Tech (fotos)"; git config user.email "actions@users.noreply.github.com"
          git add tools/fotos-cand; git commit -m "Fotos candidatas (Unsplash)" || true; git push
