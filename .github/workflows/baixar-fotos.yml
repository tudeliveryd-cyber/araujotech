name: baixar-fotos (somente leitura)
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in "comer https://pd.w.org/2026/04/10269cf3350242c23.61056435.jpg" "quedarse https://pd.w.org/2025/06/36168414d8986b968.45807581.jpg"; do set -- $p
            curl -sSL --max-time 60 -o $1.jpg "$2" && convert $1.jpg -auto-orient -resize 900x900\> -quality 82 $1-s.jpg && echo "IMG64 $1 $(base64 -w0 $1-s.jpg)"; done
