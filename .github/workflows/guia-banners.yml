name: Banners da Guía (leitura)

# Só leitura: mostra os banners salvos no painel (sem a imagem) e o que o site está servindo agora.
on:
  workflow_dispatch:

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Banners salvos e no ar
        run: |
          K=$(grep -o "AIza[A-Za-z0-9_-]*" araujo-tech-site/cuenta/index.html | head -1)
          curl -s "https://firestore.googleapis.com/v1/projects/araujotech-catalogos/databases/(default)/documents/platform/sitio?key=$K&mask.fieldPaths=gads" > gads.json
          curl -s "https://guiadesantarita.com/sitio/guia.php?g=1" > pub.json
          python3 - <<'P'
          import json, datetime
          d = json.load(open('gads.json'))
          v = d.get('fields', {}).get('gads', {}).get('arrayValue', {}).get('values', [])
          print('HOJE (Asunción):', (datetime.datetime.utcnow() - datetime.timedelta(hours=3)).date())
          print('SALVOS NO PAINEL:', len(v))
          for x in v:
              f = x['mapValue']['fields']
              g = lambda k: (list(f[k].values())[0] if k in f else None)
              img = str(g('img') or '')
              print(' -', repr(g('t')), '| on:', g('on'), '| desde:', g('from'), '| hasta:', g('to'), '| link:', g('u'), '| id:', g('id'), '| imagem:', (img[:30] + '... ' + str(len(img)) + ' chars') if img else 'SEM IMAGEM')
          try:
              p = json.load(open('pub.json'))
              print('NO AR AGORA (guia.php):', [(a.get('t'), a.get('id')) for a in p.get('ads', [])])
          except Exception as e:
              print('guia.php não respondeu JSON:', open('pub.json').read()[:200])
          P
