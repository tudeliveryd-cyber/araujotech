name: Dados públicos de Santa Rita (OpenStreetMap)

# Só leitura: baixa farmácias, hospitais e outros lugares públicos do OpenStreetMap para revisão.
# O resultado vai para o ramo 'dados' (não é publicado no site).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/osm_santa_rita.py || true
      - run: timeout 90 python3 tools/mec_santa_rita.py || true
      - name: Guardar no ramo dados
        run: |
          cd dados
          git init -q -b dados
          git config user.name "Araújo Tech (dados)"; git config user.email "actions@users.noreply.github.com"
          ls; git add -A && git commit -qm "OSM Santa Rita $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
