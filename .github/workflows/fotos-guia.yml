name: Fotos da Guía no ar

# Tira fotos das páginas da Guía como estão publicadas (só leitura) e guarda como arquivo da execução.
on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Páginas separadas por vírgula'
        default: '/'
      local:
        description: 'Prévia: usar a página do ramo escolhido (1) em vez da publicada'
        default: ''

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Tirar as fotos
        env:
          PAGES: ${{ github.event.inputs.pages }}
          LOCAL: ${{ github.event.inputs.local }}
        run: node tools/fotos_guia.js
      - name: Guardar as fotos no ramo fotos-guia (separado do site; nada é publicado)
        run: |
          cd fotos
          git init -q -b fotos-guia
          git config user.name "Araújo Tech (fotos)"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Fotos da Guía $(date -u +%F' '%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fotos-guia
