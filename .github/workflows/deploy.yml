name: Publicar catálogo Fogão Mineiro

on:
  push:
    branches: [main]
    paths-ignore:
      - 'araujo-tech-site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar lftp
        run: |
          # Ubuntu fora do ar às vezes: tenta o apt por pouco tempo; se não der, usa o lftp num contêiner Alpine.
          timeout 120 sudo apt-get update -qq || true
          if ! timeout 240 sudo apt-get install -y -qq -o Acquire::Retries=2 lftp; then
            echo "apt indisponível; usando lftp via contêiner"
            printf 'FROM alpine:3.20\nRUN apk add --no-cache lftp ca-certificates\n' | docker build -q -t at-lftp -
            printf '#!/bin/sh\nexec docker run --rm -i --network host -e LFTP_PASSWORD -v "$PWD:$PWD" -w "$PWD" at-lftp lftp "$@"\n' | sudo tee /usr/local/bin/lftp >/dev/null
            sudo chmod +x /usr/local/bin/lftp
          fi
          lftp --version | head -1
      - name: Enviar arquivos para fogaomineiro.araujotechsistemas.com
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set ssl:verify-certificate/CC:40:F0:6A:08:0C:63:04:01:05:A9:20:7B:23:53:CA:60:35:A7:05 no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u "$FTP_USERNAME" ftp://$FTP_SERVER;
            mirror --reverse --verbose --only-newer --parallel=3 \
              --exclude-glob .git* --exclude-glob .git/ --exclude-glob .github/ --exclude-glob README.md --exclude-glob araujo-tech-site/ --exclude-glob tools/ --exclude-glob .nojekyll --exclude-glob restaurante/ --exclude-glob farmacia/ \
              ./ ./;
            bye"
