name: Diagnóstico de loja

# Só leitura: mede o tamanho dos dados de uma loja real e o tempo da tela de login do painel.
on:
  workflow_dispatch:
    inputs:
      loja:
        description: 'Endereço da loja (ex.: nauticabrustolin)'
        default: 'nauticabrustolin'
      maps:
        description: 'Link de mapa para testar a leitura da ubicación (opcional)'
        default: ''
      topo:
        description: 'Só salvar a foto do topo e o logo original da loja (sim/não)'
        default: 'não'
      capturas:
        description: 'Só tirar as telas das demonstrações para apresentações (sim/não)'
        default: 'não'
      guia:
        description: 'Só medir a velocidade da Guía Vitrix (sim/não)'
        default: 'não'
      video:
        description: 'Só tirar as telas da Guía para o vídeo de divulgação (sim/não)'
        default: 'não'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ler link de mapa
        if: ${{ inputs.maps != '' }}
        env:
          U: ${{ inputs.maps }}
        run: |
          echo "redirecionamentos:"; curl -sS -o /dev/null -L --max-redirs 6 -w '%{url_effective}\n' -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)' "$U" || true
          echo "maps.php:"; curl -sS --max-time 40 -G --data-urlencode "u=$U" https://araujotechsistemas.com/maps.php; echo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar o navegador
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null || npx playwright install chromium >/dev/null
      - name: Foto do topo e logo original
        if: ${{ inputs.topo == 'sim' }}
        env:
          LOJA: ${{ inputs.loja }}
        run: node tools/foto_topo.js
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.topo == 'sim' }}
        with:
          name: topo
          path: topo/
      - name: Telas das demonstrações
        if: ${{ inputs.capturas == 'sim' }}
        run: node tools/capturas.js
      - name: Velocidade da Guía
        if: ${{ inputs.guia == 'sim' }}
        run: node tools/diag_guia.js
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.guia == 'sim' }}
        with:
          name: guia-telas
          path: guia-telas/
      - name: Telas da Guía para o vídeo
        if: ${{ inputs.video == 'sim' }}
        run: node tools/diag_video.js
      - name: Diagnóstico
        if: ${{ inputs.topo != 'sim' && inputs.capturas != 'sim' && inputs.guia != 'sim' && inputs.video != 'sim' }}
        env:
          LOJA: ${{ inputs.loja }}
        run: node tools/diag_loja.js
