name: Capturar telas das demos (com fotos)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1' # toda segunda: a foto da Guía no site fica sempre atual

permissions:
  contents: write
  actions: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Gerar as demos atuais
        run: python3 tools/make_demo.py
      - name: Tirar as telas
        run: node tools/capturar_telas.js
      - name: Foto da Guía de verdade
        run: node tools/capturar_guia.js || echo 'Guía não respondeu agora; fica a foto anterior'
      - name: Versão leve (webp) das fotos do site
        run: pip install pillow >/dev/null 2>&1; python3 tools/telas_webp.py || echo 'sem webp desta vez'
      - name: Salvar no repositório
        run: |
          git config user.name "Araújo Tech (telas)"
          git config user.email "actions@users.noreply.github.com"
          git add araujo-tech-site/img/sistemas tools/telas
          if git diff --cached --quiet; then echo "Nada mudou"; else git commit -m "Telas das demos e da Guía (automático)"; git pull --rebase; git push; echo "PUB=1" >> $GITHUB_ENV; fi
      - name: Publicar o site com as fotos novas
        if: env.PUB == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/site.yml/dispatches -f ref=main
