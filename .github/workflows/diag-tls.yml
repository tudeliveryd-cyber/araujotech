name: diag-tls (somente leitura)
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in araujotechsistemas.com www.araujotechsistemas.com lojastatus.araujotechsistemas.com fogaomineiro.araujotechsistemas.com; do
            echo "=== $h"; echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -ext subjectAltName -dates
          done
          for u in https://lojastatus.araujotechsistemas.com/sitio/guia_on.php https://lojastatus.araujotechsistemas.com/painel/ https://lojastatus.araujotechsistemas.com/loja/catalogo.html https://araujotechsistemas.com/painel/; do
            echo "URL $u -> $(curl -s -o /dev/null -w '%{http_code} %{size_download}' "$u")"; done
