name: Fotos de páginas públicas

# Só leitura: fotografa as páginas pedidas no celular e no computador.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Endereços separados por espaço'
        default: 'https://guiadesantarita.com/'
      full:
        description: 'Página inteira (1) ou só a tela (0)'
        default: '0'
      dpr:
        description: 'Densidade da foto (1 normal, 2 nítida)'
        default: '1'
      ws:
        description: 'Larguras separadas por vírgula (vazio = celular 390 e computador 1366)'
        default: ''
      local:
        description: 'Abrir o código do repositório num servidor PHP só deste teste (1) para ver páginas ainda não publicadas'
        default: '0'

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - if: inputs.local == '1'
        run: |
          # servidor PHP só dentro deste teste: lê os dados públicos (só leitura), não grava nada
          (cd araujo-tech-site && nohup php -S 127.0.0.1:8000 > /tmp/php.log 2>&1 &) ; sleep 2; curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/guia/ || true
      - run: node tools/shot_urls.js
        env:
          URLS: ${{ inputs.urls }}
          FULL: ${{ inputs.full }}
          DPR: ${{ inputs.dpr }}
          WS: ${{ inputs.ws }}
