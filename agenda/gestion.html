<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda y gestión</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/agenda/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/agenda/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#000000">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* iPhone: campos con 16px para que Safari no haga zoom al escribir */
@media (max-width:900px),(pointer:coarse){input,select,textarea,.inp{font-size:16px}}
</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral en escritorio, barra inferior en el celular; color de marca configurable que tiñe acentos y neutros */
:root{
  --brand:#8a2d49; --brand-fg:#ffffff;
  --bg:color-mix(in srgb,var(--brand) 4%,#f5f5f6); --surface:#ffffff; --surface2:color-mix(in srgb,var(--brand) 6%,#efeff0);
  --fg:#1b1a1c; --muted:#69666c; --line:color-mix(in srgb,var(--brand) 9%,#e2e2e4);
  --accent:var(--brand); --accent-fg:var(--brand-fg); --accent-soft:color-mix(in srgb,var(--brand) 11%,#ffffff);
  --good:#2c7a57; --warn:#a8711a; --bad:#b0352e; --info:#2f628a; --idle:#8a878d;
  --f:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; --shadow:0 1px 2px rgb(20 20 30 / .06), 0 6px 24px rgb(20 20 30 / .06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:color-mix(in srgb,var(--brand) 5%,#121213); --surface:color-mix(in srgb,var(--brand) 5%,#1b1b1d); --surface2:color-mix(in srgb,var(--brand) 8%,#262628);
  --fg:#f1f0f2; --muted:#a3a0a6; --line:color-mix(in srgb,var(--brand) 9%,#333336);
  --accent:color-mix(in srgb,var(--brand) 60%,#ffffff); --accent-fg:#18171a; --accent-soft:color-mix(in srgb,var(--brand) 24%,#1b1b1d);
  --good:#5cc192; --warn:#e3aa50; --bad:#ef7d72; --info:#7eaed4; --idle:#8d8a90;
  --shadow:0 1px 2px rgb(0 0 0 / .4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--brand) 5%,#121213); --surface:color-mix(in srgb,var(--brand) 5%,#1b1b1d); --surface2:color-mix(in srgb,var(--brand) 8%,#262628);
  --fg:#f1f0f2; --muted:#a3a0a6; --line:color-mix(in srgb,var(--brand) 9%,#333336);
  --accent:color-mix(in srgb,var(--brand) 60%,#ffffff); --accent-fg:#18171a; --accent-soft:color-mix(in srgb,var(--brand) 24%,#1b1b1d);
  --good:#5cc192; --warn:#e3aa50; --bad:#ef7d72; --info:#7eaed4; --idle:#8d8a90;
  --shadow:0 1px 2px rgb(0 0 0 / .4); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{padding:0 10px}
.brand .logo{width:56px;height:56px;border-radius:14px;object-fit:cover;display:block;margin-bottom:10px;background:#fff}
.brand b{display:block;font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1.1}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{background:var(--surface2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.side-foot strong{color:var(--fg);font-weight:600}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.me .grow{flex:1;min-width:0;overflow:hidden}
.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.cloud{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.cloud::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}
.cloud.on::before{background:var(--good)}
.cloud.saving::before{background:var(--warn)}
.cloud.err::before{background:var(--bad)}
.prefs{display:flex;gap:6px;align-items:center}
.main{min-width:0;padding-block:24px 48px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
.mhead{display:none}
.dhero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:18px;border:1px solid var(--line);background:var(--surface)}
.dhero .cv{position:relative;height:150px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 92%,#000),color-mix(in srgb,var(--brand) 70%,#000) 55%,color-mix(in srgb,var(--brand) 45%,#000))}
.dhero .cv::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgb(255 255 255 / .18),transparent 45%),radial-gradient(circle at 10% 110%,rgb(255 255 255 / .12),transparent 40%)}
.dhero .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero .cv::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgb(0 0 0 / .35))}
.dhero .cv .date{position:absolute;z-index:1;left:20px;bottom:56px;color:#fff;font-weight:600;font-size:13px;opacity:.9}
.dhero .cloud{display:flex;margin-top:4px}
.dhero .cd{position:relative;margin:-44px 16px 16px;background:var(--surface);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);border:1px solid var(--line)}
.dhero .lg{width:60px;height:60px;border-radius:15px;object-fit:cover;flex:none;background:#fff;border:1px solid var(--line)}
.dhero .lg.ph{display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--brand);color:var(--brand-fg);border:0}
.dhero .tx{flex:1;min-width:180px}
.dhero h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.dhero .st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-top:3px}
.dhero .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.dhero .st small{color:var(--muted);font-weight:500}
.dhero .acts{display:flex;gap:8px;flex-wrap:wrap}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{margin:0;font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted)}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.tabbar{display:none}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.icon{width:38px;padding:0}
.btn.sm.icon{width:30px}
.btn:disabled{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0}
textarea.inp{height:auto;min-height:70px;padding:9px 11px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.search .inp{padding-left:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.help{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;height:36px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg.xs button{height:28px;padding:0 9px;font-size:12px}
.swatch-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:var(--pc)}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.swatch-row input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer}
.logo-sm{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#fff}
.bp{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.bp-cover{position:relative;height:130px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 92%,#000),color-mix(in srgb,var(--brand) 45%,#000))}
.bp-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bp-card{position:relative;margin:-34px 12px 12px;background:var(--surface);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.bp-card b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-card small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-card>div:not(.bp-logo){flex:1}
.bp-logo{width:44px;height:44px;border-radius:11px;object-fit:cover;background:#fff;flex:none}
.bp-logo.ph{display:grid;place-items:center;font-weight:800;background:var(--brand);color:var(--brand-fg)}
.bp-btn{flex:none;height:32px;padding:0 14px;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:13px;display:inline-flex;align-items:center}
.bp-tag{position:absolute;top:10px;left:10px;background:rgb(0 0 0 / .55);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgb(0 0 0 / .03)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
.panel-b{padding:16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:0 1px 2px rgb(0 0 0 / .03)}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-weight:700;font-variant-numeric:tabular-nums;width:48px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--surface2);color:var(--fg)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;margin-bottom:18px;border-radius:var(--r);background:var(--accent-soft);color:var(--fg);font-size:13px}
.banner.ok{background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb, var(--c) 13%, transparent)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.st-pending{--c:var(--warn)} .st-confirmed{--c:var(--info)} .st-done{--c:var(--good)} .st-cancelled{--c:var(--idle)} .st-noshow{--c:var(--bad)} .st-low{--c:var(--bad)} .st-ok{--c:var(--good)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--surface2);color:var(--muted)}
.steps-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--fg)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}

/* Agenda */
.agbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.agbar .date-t{font-weight:700;font-size:16px;margin:0 6px}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.ag{display:grid;grid-template-columns:58px repeat(var(--cols), minmax(158px,1fr));min-width:min-content}
.ag-h{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
.ag-h small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.ag-h .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-times{border-right:1px solid var(--line)}
.ag-times div{font-size:11px;color:var(--muted);text-align:right;padding:3px 8px 0 0;font-variant-numeric:tabular-nums}
.ag-col{position:relative;border-left:1px solid var(--line)}
.ag-col:nth-child(2){border-left:0}
.slot{display:block;width:100%;border:0;background:none;border-top:1px solid var(--line);cursor:pointer;padding:0}
.slot.half{border-top-style:dashed;border-top-color:color-mix(in srgb, var(--line) 70%, transparent)}
.slot:hover{background:var(--accent-soft)}
.slot.off,.slot.off:hover{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 60%,transparent) 6px 7px);cursor:default}
.appt{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 8px 5px 10px;overflow:hidden;cursor:pointer;border:0;text-align:left;font-size:12px;line-height:1.3;
  background:color-mix(in srgb, var(--pc) 16%, var(--surface));color:var(--fg);box-shadow:inset 3px 0 0 var(--pc)}
.appt:hover{background:color-mix(in srgb, var(--pc) 26%, var(--surface))}
.appt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt.cancelled,.appt.noshow{opacity:.5;text-decoration:line-through}
.appt.done{box-shadow:inset 3px 0 0 var(--pc), inset 0 0 0 1px color-mix(in srgb, var(--good) 45%, transparent)}
.appt .ok{position:absolute;right:6px;top:5px;color:var(--good)}
.appt .ok svg{width:14px;height:14px}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--bad);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:12px;min-width:0}
.card .head{display:flex;gap:12px;align-items:center;min-width:0}
.card .head .grow{flex:1;min-width:0}
.card h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.card .meta div small{display:block;color:var(--muted);font-size:11px}
.card .meta div b{font-variant-numeric:tabular-nums}
.cat-h{margin:22px 0 10px}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--pc,var(--accent))}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f)}
.chart .gl{stroke:var(--line)}
.chart rect.b{fill:var(--accent)}
.stamps{display:flex;gap:6px;flex-wrap:wrap}
.stamps i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--accent-fg)}
.stamps i.on{background:var(--accent);border-color:var(--accent)}
.stamps i svg{width:12px;height:12px;stroke-width:2.6}
.hours-grid{display:flex;flex-direction:column;gap:6px}
.hours-grid .hrow{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px;align-items:center}
.hours-grid .hrow label{font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer}
.hours-grid .hrow input[type=time]{height:34px}
.hours-grid .hrow.off input[type=time]{opacity:.35}
.hours-grid input[type=checkbox]{accent-color:var(--accent)}
code.sql{display:block;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.5;padding:12px;border-radius:8px;background:var(--surface2);max-height:240px;overflow:auto}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photos div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface2);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgb(0 0 0 / .6);color:#fff;display:grid;place-items:center;cursor:pointer}
.photos button svg{width:14px;height:14px}

/* Modal */

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const nowHM=()=>{const n=new Date();return toHM(n.getHours()*60+n.getMinutes())};
const toMin=h=>{const[a,b]=h.split(":").map(Number);return a*60+b};
const toHM=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const gs=n=>"₲ "+Math.round(n||0).toLocaleString("es-PY");
const fmtDate=(s,o)=>{const r=parse(s).toLocaleDateString(t("dateFmt"),o||{weekday:"long",day:"numeric",month:"long"});return r.charAt(0).toUpperCase()+r.slice(1)};
const short=s=>parse(s).toLocaleDateString(t("dateFmt"),{day:"2-digit",month:"2-digit"});
const initials=n=>String(n||"?").split(/\s+/).filter(w=>/^\p{L}/u.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join("");

/* Toma el color principal del logo: el tono con más presencia entre los píxeles con color; si el logo es neutro, usa su tono oscuro */
function dominantColor(src,cb){if(!src)return cb(null);const img=new Image();img.onload=()=>{try{
  const c=document.createElement("canvas"),N=64;c.width=c.height=N;const x=c.getContext("2d");x.drawImage(img,0,0,N,N);const d=x.getImageData(0,0,N,N).data;
  const B=Array.from({length:36},()=>({w:0,r:0,g:0,b:0}));const dark={n:0,r:0,g:0,b:0};
  for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;const r=d[i],g=d[i+1],b=d[i+2];const mx=Math.max(r,g,b)/255,mn=Math.min(r,g,b)/255,l=(mx+mn)/2,ch=mx-mn;
    if(l>.93)continue;const s=ch===0?0:ch/(1-Math.abs(2*l-1));
    if(s<.22||l<.1||l>.88){if(l<.45){dark.n++;dark.r+=r;dark.g+=g;dark.b+=b}continue}
    let h;const R=r/255,G=g/255,Bl=b/255;if(mx===R)h=((G-Bl)/ch)%6;else if(mx===G)h=(Bl-R)/ch+2;else h=(R-G)/ch+4;h=(h*60+360)%360;
    const k=Math.floor(h/10),w=s*(1-Math.abs(l-.5));B[k].w+=w;B[k].r+=r*w;B[k].g+=g*w;B[k].b+=b*w}
  const best=B.reduce((a,v)=>v.w>a.w?v:a,{w:0});const hex=(r,g,b)=>"#"+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
  if(best.w>1){let r=best.r/best.w,g=best.g/best.w,b=best.b/best.w;const L=(Math.max(r,g,b)+Math.min(r,g,b))/510;
    if(L>.62){const f=.62/L;r*=f;g*=f;b*=f}return cb(hex(r,g,b))}
  if(dark.n>20)return cb(hex(dark.r/dark.n,dark.g/dark.n,dark.b/dark.n));cb(null)}catch(e){cb(null)}};img.onerror=()=>cb(null);img.src=src}

function compressImg(file,max,square,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");
  if(square){const s=Math.min(img.width,img.height);c.width=c.height=max;c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,max,max);cb(c.toDataURL("image/png"))}
  else{const k=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))}};img.src=r.result};r.readAsDataURL(file)}

V.cash=()=>{

  const exps=S.expenses.filter(e=>e.date===d);
  const svcTot=paid.reduce((s,a)=>s+a.paid.amount,0), prodTot=paid.reduce((s,a)=>s+(payTotal(a)-a.paid.amount),0)+sales.reduce((s,x)=>s+x.total,0);
  const tot=svcTot+prodTot, expTot=exps.reduce((s,e)=>s+e.amount,0);
  const by=m=>paid.filter(a=>a.paid.method===m).reduce((s,a)=>s+payTotal(a),0)+sales.filter(s=>s.method===m).reduce((s,x)=>s+x.total,0);

function range(){
  const d=today(), dt=parse(d);
  if(ui.period==="today") return[d,d];
  if(ui.period==="7") return[addDays(d,-6),d];
  if(ui.period==="last"){const a=new Date(dt.getFullYear(),dt.getMonth()-1,1),b=new Date(dt.getFullYear(),dt.getMonth(),0);return[ymd(a),ymd(b)]}
  return[ymd(new Date(dt.getFullYear(),dt.getMonth(),1)),d];
}
V.reports=()=>{
  const[a,b]=range();
  const inR=S.appts.filter(x=>x.date>=a&&x.date<=b);
  const paid=inR.filter(x=>x.paid), rev=paid.reduce((s,x)=>s+payTotal(x),0)+S.sales.filter(s=>s.date>=a&&s.date<=b).reduce((s,x)=>s+x.total,0);
  const ns=inR.filter(x=>x.status==="noshow").length, past=inR.filter(x=>x.date<=today()&&x.status!=="cancelled").length;
  const newC=S.clients.filter(c=>c.created>=a&&c.created<=b).length;
  const days=[];for(let d=a;d<=b;d=addDays(d,1))days.push(d);
  const perDay=days.map(d=>paid.filter(x=>x.date===d).reduce((s,x)=>s+payTotal(x),0)+S.sales.filter(s=>s.date===d).reduce((s,x)=>s+x.total,0));
  const svc={};paid.forEach(x=>{const list=x.serviceIds.map(id=>S.services.find(s=>s.id===id)).filter(Boolean);const base=list.reduce((s,v)=>s+v.price,0)||1;
    list.forEach(v=>{svc[v.id]=svc[v.id]||{n:0,v:0,name:v.name};svc[v.id].n++;svc[v.id].v+=x.paid.amount*v.price/base})});
  const top5=Object.values(svc).sort((x,y)=>y.v-x.v).slice(0,6), maxS=top5[0]?.v||1;
  const per=[["today","p_today"],["7","p_7"],["month","p_month"],["last","p_last"]];
  return top(t("reports"),short(a)+" – "+short(b),"")+`
  <div class="seg" style="margin-bottom:16px;flex-wrap:wrap">${per.map(([k,l])=>`<button data-act="period" data-p="${k}" class="${ui.period===k?"on":""}">${t(l)}</button>`).join("")}</div>
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">${t("revenue")}</span><b>${gs(rev)}</b></div>
    <div class="kpi"><span class="eyebrow">${t("attended")}</span><b>${paid.length}</b><small>${newC} ${t("newCl").toLowerCase()}</small></div>
    <div class="kpi"><span class="eyebrow">${t("ticketAvg")}</span><b>${gs(paid.length?rev/paid.length:0)}</b></div>
    <div class="kpi"><span class="eyebrow">${t("noshowRate")}</span><b>${past?Math.round(ns/past*100):0}%</b><small>${ns}</small></div>
  </div>
  ${days.length>1?`<section class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>${t("perDay")}</h2></div><div class="panel-b">${chart(days,perDay)}</div></section>`:""}
  <div class="cols">
    <section class="panel"><div class="panel-h"><h2>${t("byPro")}</h2></div><div class="tbl-wrap"><table><thead><tr><th>${t("pro")}</th><th class="r">${t("attended")}</th><th class="r">${t("revenue")}</th><th class="r">${t("commissions")}</th></tr></thead><tbody>
      ${S.pros.map(p=>{const l=paid.filter(x=>x.proId===p.id),v=l.reduce((s,x)=>s+x.paid.amount,0);return `<tr><td><div class="row" style="flex-wrap:nowrap"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</div></td><td class="r num">${l.length}</td><td class="r num">${gs(v)}</td><td class="r num"><b>${gs(v*p.commission/100)}</b></td></tr>`}).join("")}
    </tbody></table></div></section>
    <section class="panel"><div class="panel-h"><h2>${t("topSvc")}</h2></div><div class="panel-b" style="display:flex;flex-direction:column;gap:14px">
      ${top5.length?top5.map(s=>`<div><div class="row" style="justify-content:space-between;margin-bottom:6px;flex-wrap:nowrap"><span style="font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)} <span style="color:var(--muted);font-weight:500">· ${s.n}</span></span><span class="num">${gs(s.v)}</span></div><div class="bar"><i style="width:${s.v/maxS*100}%"></i></div></div>`).join(""):`<div class="empty">${t("noData")}</div>`}
    </div></section>
  </div>`;
};
function chart(days,vals){
  const W=Math.max(560,days.length*26),H=220,L=56,B=26,Tp=10,max=Math.max(...vals,1);
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const f=max/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p})();
  const y=v=>Tp+(H-Tp-B)*(1-v/nice), bw=(W-L-8)/days.length;
  const ticks=[0,.25,.5,.75,1].map(f=>f*nice);
  const k=v=>v>=1e6?(v/1e6).toFixed(v%1e6?1:0)+"M":v>=1e3?Math.round(v/1e3)+"k":v;
  const every=Math.ceil(days.length/12);
  return `<div class="tbl-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W,560)}px;display:block" role="img" aria-label="${t("perDay")}">
    ${ticks.map(v=>`<line class="gl" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${k(v)}</text>`).join("")}
    ${vals.map((v,i)=>`<rect class="b" x="${L+i*bw+bw*.18}" y="${y(v)}" width="${bw*.64}" height="${Math.max(0,H-B-y(v))}" rx="2"><title>${short(days[i])}: ${gs(v)}</title></rect>`).join("")}
    ${days.map((d,i)=>i%every===0?`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${short(d)}</text>`:"").join("")}
  </svg></div>`;
}

const SQL=`-- 1. Datos del negocio: solo usuarios con cuenta (responsable y equipo)
create table if not exists salon_state (id text primary key, data jsonb, updated_at timestamptz default now());
alter table salon_state enable row level security;
create policy "equipo_lee_y_escribe" on salon_state for all to authenticated using (true) with check (true);

-- 2. Información pública para la página de reservas (sin datos de clientes)
create table if not exists public_info (id text primary key, data jsonb, updated_at timestamptz default now());
alter table public_info enable row level security;
create policy "todos_leen" on public_info for select to anon, authenticated using (true);
create policy "equipo_crea" on public_info for insert to authenticated with check (true);
create policy "equipo_actualiza" on public_info for update to authenticated using (true);

-- 3. Reservas: el público solo puede crear, el equipo lee y procesa
create table if not exists reservas (id uuid primary key default gen_random_uuid(), created_at timestamptz default now(), nombre text, telefono text, servicios text[], profesional text, fecha date, hora text, duracion int, precio int, productos jsonb, procesada boolean default false);
alter table reservas add column if not exists productos jsonb;
alter table reservas enable row level security;
create policy "publico_crea" on reservas for insert to anon, authenticated with check (procesada = false);
create policy "equipo_lee" on reservas for select to authenticated using (true);
create policy "equipo_actualiza" on reservas for update to authenticated using (true);

alter publication supabase_realtime add table salon_state, reservas;`;

function render(){

function modal(title,body,foot,cls=""){
  $("#layer").innerHTML=`<div class="ov" data-act="ovClose"><div class="modal ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="m-h"><h2>${esc(title)}</h2><button class="btn ghost icon" data-act="closeM" aria-label="${t("close")}">${ic("x")}</button></div>
    <div class="m-b">${body}</div>${foot?`<div class="m-f">${foot}</div>`:""}</div></div>`;
  const f=$("#layer .m-b input:not([type=checkbox]):not([type=hidden]),#layer .m-b select");if(f&&window.innerWidth>820)f.focus();
}
const closeM=()=>{$("#layer").innerHTML=""};
function toast(msg,undoFn){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.innerHTML=ic("check")+`<span>${esc(msg)}</span>`;
  if(undoFn){const b=document.createElement("button");b.className="btn sm";b.textContent=t("undo");b.onclick=()=>{el.remove();undoFn()};el.appendChild(b)}
  document.body.appendChild(el);setTimeout(()=>el.remove(),undoFn?7000:2400);
}
function undoable(msg,u){toast(msg,()=>{S=normalize(JSON.parse(u));save();applyBrand();closeM();render();toast(t("undone"))})}
function ask(msg,yes){
  modal(t("sure"),`<p style="margin:0">${esc(msg)}</p>`,`<button class="btn" data-act="closeM">${t("cancel")}</button><button class="btn pri" id="askYes">${t("yes")}</button>`,"sm");

}

   <div class="field"><label for="f-notes">${t("notes")}</label><textarea class="inp" id="f-notes" rows="2">${esc(a.notes||"")}</textarea></div>`;

    <button class="btn" data-act="closeM">${t("cancel")}</button><button class="btn pri" id="f-save">${t("save")}</button>`;
  modal(isNew?t("newAppt"):t("editAppt"),body,foot);

function prodPicker(items){

function bindPicker(items,onChange){
  $("#pp-add").onclick=()=>{const id=$("#pp-sel").value,q=+$("#pp-qty").value||1;const p=S.products.find(x=>x.id===id);if(!p)return;
    const ex=items.find(i=>i.id===id);if(ex)ex.qty+=q;else items.push({id,name:p.name,price:p.price,qty:q});
    $("#pp-lines").innerHTML=items.map(i=>`<div class="prod-line"><span>${i.qty}× ${esc(i.name)}</span><b class="num">${gs(i.price*i.qty)}</b></div>`).join("");$("#pp-sel").value="";onChange()};
}
function stockOut(items){items.forEach(i=>{const p=S.products.find(x=>x.id===i.id);if(p)p.stock=Math.max(0,p.stock-i.qty)})}
function checkout(a){
  let method="cash";const items=(a.items||[]).filter(i=>S.products.some(p=>p.id===i.id)).map(i=>({...i}));
  const svs=a.serviceIds.map(id=>S.services.find(s=>s.id===id)).filter(Boolean);
  const reward=loyaltyReady(a.clientId);
  const body=`<div><b>${esc(cliOf(a.clientId).name)}</b><div style="color:var(--muted)">${fmtDate(a.date,{day:"numeric",month:"long"})} · ${a.start} · ${esc(proOf(a.proId).name)}</div></div>
    ${reward?`<div class="infobox">${ic("star")}<span style="flex:1">${t("rewardReady")} ${esc(S.cfg.loyalty.reward)}</span><button class="btn sm" id="k-reward">${t("applyReward")}</button></div>`:""}
    <div style="display:flex;flex-direction:column;gap:6px">${svs.map(s=>`<div class="sum-row"><span>${esc(s.name)}</span><span>${gs(s.price)}</span></div>`).join("")}
    <div class="sum-row"><span>${t("subtotal")}</span><span>${gs(a.price)}</span></div>${a.deposit?`<div class="sum-row"><span>${t("depositS")}</span><span>−${gs(a.deposit)}</span></div>`:""}</div>
    ${prodPicker(items)}
    <div class="field"><label for="k-disc">${t("discount")} (₲)</label><input class="inp num" type="number" min="0" step="1000" id="k-disc" value="0"></div>
    <div class="field"><label>${t("method")}</label><div class="methods" id="k-m"><button class="on" data-m="cash">${t("cashM")}</button><button data-m="transfer">${t("transfer")}</button><button data-m="card">${t("card")}</button></div></div>
    <div class="total-line"><span class="eyebrow">${t("total")}</span><b id="k-tot"></b></div>`;
  modal(t("checkout"),body,`<button class="btn" data-act="closeM">${t("cancel")}</button><button class="btn pri" id="k-ok">${ic("check")}${t("charge")}</button>`,"sm");
  const svcTot=()=>Math.max(0,a.price-(a.deposit||0)-(+$("#k-disc").value||0));
  const prodTot=()=>items.reduce((s,i)=>s+i.price*i.qty,0);
  const upd=()=>{$("#k-tot").textContent=gs(svcTot()+prodTot())};upd();

/* imágenes van en documentos aparte (límite de tamaño de cada documento) */
const IMG={},IMG_UP=new Set();
function hImg(x){let h=2166136261;for(let i=0;i<x.length;i+=7){h^=x.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+x.length.toString(36)}
function extImgs(o){const imgs={};const w=v=>{if(typeof v==="string"&&v.startsWith("data:image")&&v.length>1500){const h=hImg(v);imgs[h]=v;IMG[h]=v;return "img:"+h}if(Array.isArray(v))return v.map(w);if(v&&typeof v==="object"){const r={};for(const k in v)r[k]=w(v[k]);return r}return v};return {o:w(o),imgs}}
async function resImgs(o){const need=new Set();const sc=v=>{if(typeof v==="string"&&v.startsWith("img:"))need.add(v.slice(4));else if(Array.isArray(v))v.forEach(sc);else if(v&&typeof v==="object")Object.values(v).forEach(sc)};sc(o);
 await Promise.all([...need].map(async h=>{IMG_UP.add(h);if(!(h in IMG)){try{IMG[h]=await FA.getImg(h)||""}catch(e){IMG[h]=""}}}));
 const w=v=>{if(typeof v==="string"&&v.startsWith("img:"))return IMG[v.slice(4)]||"";if(Array.isArray(v))return v.map(w);if(v&&typeof v==="object"){const r={};for(const k in v)r[k]=w(v[k]);return r}return v};return w(o)}
async function upImgs(imgs){for(const h in imgs){if(IMG_UP.has(h))continue;await FA.putImg(h,imgs[h]);IMG_UP.add(h)}}
async function fbPush(){
  try{let data=localPlain(),json=JSON.stringify(data);
    if(json===lastRemote){setCloud("on");return}
    const cur=await FA.getState();const remote=cur?await resImgs(JSON.parse(cur)):null;
    if(remote&&lastRemote&&JSON.stringify(remote)!==lastRemote){data=merge3(JSON.parse(lastRemote),data,remote);json=JSON.stringify(data);adoptMerged(JSON.parse(json))}
    const e1=extImgs(data);await upImgs(e1.imgs);await FA.putState(JSON.stringify(e1.o));lastRemote=json;
    const e2=extImgs(publicInfo());await upImgs(e2.imgs);await FA.putPub(JSON.stringify(e2.o));setCloud("on");
  }catch(e){console.warn(e);setCloud("err")}
}

/* Junta tres versiones: la última sincronizada (base), la de este equipo (local) y la de la nube (remote).
   Gana el cambio de cada uno en lo que tocó: dos personas pueden guardar al mismo tiempo sin borrar lo del otro. */
const SYNC_COLS=["users","pros","services","products","clients","appts","sales","expenses"];
function merge3(base,local,remote){
  const j=x=>JSON.stringify(x),out=JSON.parse(j(remote)),strip=c=>{const o=Object.assign({},c||{});delete o.sb;return o};
  if(j(strip(local.cfg))!==j(strip(base.cfg)))out.cfg=Object.assign({},local.cfg);
  ["sample","welcomeSeen"].forEach(k=>{if(local[k]!==base[k])out[k]=local[k]});
  SYNC_COLS.forEach(k=>{
    const b=new Map((base[k]||[]).map(x=>[x.id,j(x)])),l=new Map((local[k]||[]).map(x=>[x.id,x]));
    let arr=(out[k]||[]).filter(x=>!(b.has(x.id)&&!l.has(x.id)));
    l.forEach((x,id)=>{if(b.get(id)!==j(x)){const i=arr.findIndex(y=>y.id===id);if(i>=0)arr[i]=x;else arr.push(x)}});
    out[k]=arr;
  });
  const bc=base.closings||{},lc=local.closings||{};out.closings=Object.assign({},remote.closings||{});
  Object.keys(bc).forEach(d=>{if(!(d in lc))delete out.closings[d]});
  Object.keys(lc).forEach(d=>{if(j(lc[d])!==j(bc[d]))out.closings[d]=lc[d]});
  return out;
}
function localPlain(){const d=JSON.parse(JSON.stringify(S));delete d.cfg.sb;return d}
function adoptMerged(d){pulling=true;const keep=S.cfg.sb;S=normalize(d);S.cfg.sb=keep||{url:"",key:""};S.welcomeSeen=true;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pulling=false;applyBrand();if(ui.user&&!$("#layer").innerHTML)render()}
async function pushNow(){
  try{let data=localPlain(),json=JSON.stringify(data);
    if(json===lastRemote){setCloud("on");return}
    const cur=await sb.from("salon_state").select("data").eq("id","main").maybeSingle();if(cur.error)throw cur.error;
    const remote=cur.data&&cur.data.data;
    if(remote&&lastRemote&&JSON.stringify(remote)!==lastRemote){data=merge3(JSON.parse(lastRemote),data,remote);json=JSON.stringify(data);adoptMerged(JSON.parse(json))}
    const at=new Date().toISOString();
    const r1=await sb.from("salon_state").upsert({id:"main",data,updated_at:at});if(r1.error)throw r1.error;lastRemote=json;
    const r2=await sb.from("public_info").upsert({id:"main",data:publicInfo(),updated_at:at});setCloud(r2.error?"err":"on");
  }catch(e){console.warn(e);setCloud("err")}
}
function applyRemote(data){
  if(!data||!data.cfg)return;const json=JSON.stringify(data);if(json===lastRemote)return;
  const loc=localPlain(),pending=lastRemote&&JSON.stringify(loc)!==lastRemote;
  const next=pending?merge3(JSON.parse(lastRemote),loc,data):data;
  lastRemote=json;adoptMerged(next);if(pending)cloudPush();
}
async function importBookings(rows){

    r.servicios=(Array.isArray(r.servicios)?r.servicios:[]).slice(0,20).map(x=>txt(x,40));
    if(!/^[A-Za-z0-9_-]{1,40}$/.test(String(r.id))||!/^\d{4}-\d{2}-\d{2}$/.test(String(r.fecha))||!/^([01]\d|2[0-3]):[0-5]\d$/.test(String(r.hora))){try{if(FB_ON)await FA.markBooking(r.id)}catch(e){}continue}
    r.duracion=+r.duracion>=5&&+r.duracion<=720?Math.round(+r.duracion):0;r.precio=+r.precio>0&&isFinite(+r.precio)?Math.round(+r.precio):0;

    if(!proId){const d=toMin(r.hora);proId=(activePros().find(p=>!S.appts.some(a=>a.proId===p.id&&a.date===r.fecha&&live(a)&&d<toMin(a.start)+a.dur&&d+dur>toMin(a.start)))||activePros()[0]||{}).id}
    const items=(Array.isArray(r.productos)?r.productos:[]).map(i=>{const p=S.products.find(x=>x.id===i.id);return p?{id:p.id,name:p.name,price:p.price,qty:Math.max(1,+i.qty||1)}:null}).filter(Boolean);
    const d0=toMin(r.hora),clash=!!proId&&S.appts.some(a=>a.proId===proId&&a.date===r.fecha&&live(a)&&d0<toMin(a.start)+a.dur&&d0+dur>toMin(a.start));
    S.appts.push({id:"rv_"+r.id,clientId:c.id,proId,serviceIds:svs.map(s=>s.id),date:r.fecha,start:r.hora,dur,price:svs.reduce((s,v)=>s+v.price,0)||r.precio,status:"pending",notes:(clash?(LG()!=="pt"?"ATENCIÓN: ese horario ya estaba ocupado. Reubicar o avisar al cliente. · ":"ATENÇÃO: esse horário já estava ocupado. Remarcar ou avisar o cliente. · "):"")+"Reserva online"+(items.length?" · "+(LG()!=="pt"?"Separar: ":"Separar: ")+items.map(i=>i.qty+"× "+i.name).join(", "):""),paid:null,deposit:0,...(items.length?{items}:{})});
    n++;try{if(FB_ON)await FA.markBooking(r.id);else await sb.from("reservas").update({procesada:true}).eq("id",r.id)}catch(e){}}

function loadSbLib(){return new Promise(res=>{if(window.supabase)return res();const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";s.onload=res;s.onerror=res;document.head.appendChild(s)})}
async function cloudInit(){
  if(FB_ON)return fbInit();
  const c=sbCfg();if(!c.url||!c.key)return;
  ui.cloudMode=true;ui.user=null;render();
  await loadSbLib();
  if(!window.supabase){ui.cloud="err";ui.authErr=t("cloudErr");render();return}
  try{sb=window.supabase.createClient(c.url,c.key);const {data}=await sb.auth.getSession();
    if(data&&data.session)await afterAuth(data.session.user);else render();
  }catch(e){console.warn(e);ui.cloud="err";ui.authErr=t("cloudErr");sb=null;render()}
}
async function afterAuth(user){
  const email=(user.email||"").toLowerCase();
  const {data,error}=await sb.from("salon_state").select("data").eq("id","main").maybeSingle();
  if(error){ui.authErr=t("cloudErr")+": "+error.message;ui.cloud="err";render();return}
  if(data&&data.data)applyRemote(data.data);
  else{S.cfg.ownerEmails=[email];S.welcomeSeen=true;lastRemote=""}
  const owners=(S.cfg.ownerEmails||[]).map(x=>x.trim().toLowerCase());
  if(owners.includes(email))ui.user={id:"owner:"+email,name:S.users[0]?.name||email,role:"owner"};
  else{const p=S.pros.find(p=>(p.email||"").toLowerCase()===email&&p.active!==false);
    if(p)ui.user={id:"pro_"+p.id,name:p.name,role:"pro",proId:p.id};
    else{ui.user=null;ui.authErr=t("noAccess");await sb.auth.signOut();render();return}}
  ui.authErr="";ui.cloud="on";
  if(!data||!data.data)await pushNow();
  if(!subscribed){subscribed=true;
    sb.channel("salon").on("postgres_changes",{event:"*",schema:"public",table:"salon_state"},p=>{if(p.new&&p.new.data)applyRemote(p.new.data)})
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"reservas"},p=>importBookings([p.new])).subscribe();}
  try{const {data:rv}=await sb.from("reservas").select("*").eq("procesada",false);if(rv&&rv.length)importBookings(rv)}catch(e){}
  ui.view="dash";render();
}
